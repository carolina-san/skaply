name: Deploy Lynk ABP 25

on:
  push:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npm run db:generate

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend (optional)
        working-directory: frontend
        run: npm run build


  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            echo "🚀 Iniciando despliegue seguro..."

            # Cargar entorno de Node
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            cd /var/www/skaply/lynk_abp25

            echo "📦 Sincronizando Git..."
            git fetch origin main
            git reset --hard origin/main

            echo "📂 Actualizando Backend..."
            cd backend
            npm ci
            npm run build

            echo "🔄 Reiniciando Backend (PM2 como emilia)..."
            sudo -u emilia pm2 restart lynk_backend --update-env || \
            sudo -u emilia pm2 start dist/index.js --name lynk_backend

            echo "🌐 Actualizando Frontend..."
            cd ../frontend
            npm ci
            npm run build

            echo "📁 Frontend listo (Apache sirve desde dist dentro del repo)."
            test -f /var/www/skaply/lynk_abp25/frontend/dist/frontend/browser/index.html

            echo "📊 Estado de PM2:"
            sudo -u emilia pm2 status

            echo "✅ ¡Despliegue de Lynk ABP 25 completado!"