name: Deploy Lynk ABP 25

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma Client
        run: |
          cd backend
          pnpm run db:generate

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            echo "🚀 Iniciando despliegue seguro..."

            # Cargar entorno de Node
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            # 1. Ir a la carpeta del proyecto
            cd /var/www/skaply/lynk_abp25

            echo "📦 Sincronizando Git..."
            git fetch origin main
            git reset --hard origin/main

            echo "📂 Actualizando Backend..."
            cd backend
            pnpm install --frozen-lockfile
            pnpm run db:generate
            # pnpm run db:deploy # Descomenta si usas Prisma Migrations
            pnpm run build

            # 2. Reiniciar PM2 usando la ruta verificada
            sudo -u emilia pm2 restart lynk_backend || sudo -u emilia pm2 start dist/index.js --name "lynk_backend"

            echo "🌐 Actualizando Frontend..."
            cd ../frontend
            pnpm install --frozen-lockfile
            pnpm run build:prod

            echo "📁 Desplegando archivos en Apache..."
            # Limpiamos solo el contenido de skaply, pero NO la carpeta del proyecto
            # Usamos find para borrar todo excepto la carpeta del código fuente para mayor seguridad
            sudo find /var/www/skaply/ -maxdepth 1 ! -name 'lynk_abp25' ! -name 'skaply' -exec rm -rf {} +
            
            # Copiamos el build del frontend a la raíz de skaply
            sudo cp -r dist/frontend/browser/* /var/www/skaply/
            
            # 3. Corregir permisos para que Apache pueda leerlo
            sudo chown -R www-data:www-data /var/www/skaply/
            sudo chmod -R 755 /var/www/skaply/

            echo "✅ ¡Despliegue de Lynk ABP 25 completado!"
            pm2 status