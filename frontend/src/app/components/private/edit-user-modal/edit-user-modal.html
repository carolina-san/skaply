<app-modal [open]="open" (openChange)="open = $event; openChange.emit($event)">
    <div class="bg-white rounded-xl">
        <div class="px-6 py-4 border-b border-gray-200">
            <h2 class="text-xl font-bold text-marron-oscuro">Editar
                {{ role === 'provider' ? 'Proveedor' : 'Usuario' }}</h2>
        </div>

        <form [formGroup]="editForm" (ngSubmit)="onSubmit()" class="p-6 space-y-4">
            <div class="flex items-center gap-4">
                <div class="relative group w-20 h-20 rounded-xl overflow-hidden border-2 border-gray-300 flex-shrink-0">
                    <img *ngIf="imagePreview || user?.image_url" [src]="imagePreview || user?.image_url" alt="Preview"
                        class="w-full h-full object-cover" />

                    <div *ngIf="!imagePreview && !user?.image_url"
                        class="w-full h-full bg-gray-100 flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                            fill="#9CA3AF">
                            <path
                                d="M480-480q-66 0-113-47t-47-113q0-66 47-113t113-47q66 0 113 47t47 113q0 66-47 113t-113 47ZM160-160v-112q0-34 17.5-62.5T224-378q62-31 126-46.5T480-440q66 0 130 15.5T736-378q29 15 46.5 43.5T800-272v112H160Z" />
                        </svg>
                    </div>

                    <label [for]="uniqueId" class="absolute inset-0 bg-black/50 opacity-0
                            group-hover:opacity-100 flex items-center justify-center text-white 
                            cursor-pointer transition text-xs font-medium">
                        Cambiar
                    </label>

                    <input [id]="uniqueId" type="file" accept="image/*" (change)="onImageSelected($event)"
                        class="hidden" />
                </div>

                <div class="flex-1">
                    <button type="button" (click)="removeImage()" *ngIf="imagePreview"
                        class="text-sm text-red-600 hover:underline mb-1">
                        Deshacer
                    </button>
                    <p class="text-xs text-gray-500">JPG, PNG o GIF (máx 2MB)</p>
                </div>
            </div>

            <!-- Información personal -->
            <div class="space-y-3">
                <div *ngIf="role === 'provider'">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Empresa</label>
                    <input type="text" formControlName="company_name"
                        class="w-full px-3 py-2 border border-gray-300 text-marron-oscuro rounded-md focus:outline-none focus:ring-2 focus:ring-azul-claro"
                        placeholder="Nombre de la empresa" />
                </div>

                <div *ngIf="role === 'admin'">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
                    <input type="text" formControlName="name"
                        class="w-full px-3 py-2 border border-gray-300 text-marron-oscuro rounded-md focus:outline-none focus:ring-2 focus:ring-azul-claro"
                        placeholder="Tu nombre" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" formControlName="email"
                        class="w-full px-3 py-2 border border-gray-300 text-marron-oscuro rounded-md focus:outline-none focus:ring-2 focus:ring-azul-claro"
                        placeholder="tu@email.com" />
                    <p *ngIf="editForm.get('email')?.invalid && editForm.get('email')?.touched"
                        class="text-red-500 text-xs mt-1">Email
                        inválido</p>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Teléfono</label>
                    <input type="tel" formControlName="telephone"
                        class="w-full px-3 py-2 border border-gray-300 text-marron-oscuro rounded-md focus:outline-none focus:ring-2 focus:ring-azul-claro"
                        placeholder="+34 123 456 789" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nueva contraseña (opcional)</label>
                    <input type="password" formControlName="password" placeholder="Dejar vacío para mantener la actual"
                        class="w-full px-3 py-2 border border-gray-300 text-marron-oscuro rounded-md focus:outline-none focus:ring-2 focus:ring-azul-claro" />
                    <p *ngIf="editForm.get('password')?.invalid && editForm.get('password')?.touched"
                        class="text-red-500 text-xs mt-1">
                        Mínimo 12
                        caracteres</p>
                </div>
            </div>

            <div *ngIf="localErrorMessage || errorMessage"
                class="bg-red-100 border border-red-400 text-red-700 text-sm px-3 py-2 rounded-lg relative">
                {{ localErrorMessage || errorMessage }}
            </div>

            <div *ngIf="successMessage"
                class="bg-green-100 border border-green-400 text-green-700 text-sm px-3 py-2 rounded-lg relative">
                {{ successMessage }}
            </div>

            <div class="flex justify-end gap-3 pt-3 border-t border-gray-200">
                <button type="button" (click)="closeModal()" class="px-4 py-2 border border-gray-300 rounded-lg text-marron-oscuro 
                           hover:bg-gray-50 transition text-sm">
                    Cancelar
                </button>

                <button type="submit" [disabled]="isSubmitting || !hasChanges" class="px-5 py-2 bg-marron-oscuro text-white rounded-lg
                           hover:bg-marron-oscuro/90 disabled:opacity-50 
                           disabled:cursor-not-allowed transition text-sm">
                    {{ isSubmitting ? 'Guardando...' : 'Guardar' }}
                </button>
            </div>
        </form>
    </div>
</app-modal>
