<!-- MEJORA PARA EL FUTURO: que las 3 rayas se conviertan en la x (animación)-->
<div class="lg:hidden  items-center flex justify-center items-center w-full py-4">
  <!-- Botón hamburguesa -->
  <span (click)="toggleMenu()" class="absolute cursor-pointer text-3xl right-5 z-50" disabled>
    <svg *ngIf="menuAbierto" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
      fill="#dcd6d5">
      <path
        d="M480-424 284-228q-11 11-28 11t-28-11q-11-11-11-28t11-28l196-196-196-196q-11-11-11-28t11-28q11-11 28-11t28 11l196 196 196-196q11-11 28-11t28 11q11 11 11 28t-11 28L536-480l196 196q11 11 11 28t-11 28q-11 11-28 11t-28-11L480-424Z" />
    </svg>

    <svg *ngIf="!menuAbierto" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
      fill="#dcd6d5">
      <path
        d="M160-240q-17 0-28.5-11.5T120-280q0-17 11.5-28.5T160-320h640q17 0 28.5 11.5T840-280q0 17-11.5 28.5T800-240H160Zm0-200q-17 0-28.5-11.5T120-480q0-17 11.5-28.5T160-520h640q17 0 28.5 11.5T840-480q0 17-11.5 28.5T800-440H160Zm0-200q-17 0-28.5-11.5T120-680q0-17 11.5-28.5T160-720h640q17 0 28.5 11.5T840-680q0 17-11.5 28.5T800-640H160Z" />
    </svg>
  </span>


  <!-- Bocadillo animado desde el botón -->
  <div class="fixed top-18 lg:top-12 right-5 z-40">
    <div class="origin-top-right bg-white shadow-2xl rounded-3xl p-4 flex flex-col gap-2
             transform transition-all duration-300 scale-95 opacity-0 invisible" [ngClass]="{
        'scale-100 opacity-100 visible translate-y-0': menuAbierto,
        'scale-95 opacity-0 invisible -translate-y-2': !menuAbierto
      }">
      <a href="https://skaply.ovh/lynk" class="hover:bg-beige-oscuro transition-colors
      duration-200 bg-beige px-3 py-1 rounded-full text-marron-oscuro font-semibold">

        Conoce al Equipo</a>

      <a routerLink="/catalogo" class="hover:bg-azul-medio transition-colors
      duration-200 bg-azul-claro px-3 py-1 rounded-full text-marron-oscuro font-semibold">Accede a Skäply</a>
    </div>
  </div>
</div>


<!-- Menú principal de la landing en portátiles -->
<nav class="hidden lg:flex items-center space-x-5 text-lg relative">
  <a href="https://skaply.ovh/lynk" class="btn-azul gap-2 hover:gap-4 bg-beige! hover:bg-beige-oscuro!">Conoce al equipo
    <img src="/assets/logo_lynk.svg" alt="Logo Lynk" class="w-12 h-6 object-contain" />
  </a>
  <a routerLink="/catalogo" class="btn-azul">Accede a Skäply
