<div *ngIf="isOpen" class="fixed inset-0 bg-black/50 z-40 transition-opacity duration-300"
  [class.opacity-0]="!isAnimating" [class.opacity-100]="isAnimating" (click)="closeModal()">
</div>

<!-- Modal -->
<div *ngIf="isOpen"
  class="fixed top-0 right-0 h-full w-full sm:w-96 bg-white z-50 shadow-2xl flex flex-col transition-transform duration-300 ease-out"
  [class.translate-x-full]="!isAnimating" [class.translate-x-0]="isAnimating">

  <!-- Header -->
  <div class="flex items-center justify-between p-4 border-b border-gray-200">
    <h2 class="text-2xl font-bold text-marron-oscuro">Filtros</h2>
    <button (click)="closeModal()" class="p-2 hover:bg-gray-100 rounded-full transition-colors cursor-pointer">
      <span class="material-symbols-rounded text-marron-oscuro">
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor">
          <path
            d="M480-424 284-228q-11 11-28 11t-28-11q-11-11-11-28t11-28l196-196-196-196q-11-11-11-28t11-28q11-11 28-11t28 11l196 196 196-196q11-11 28-11t28 11q11 11 11 28t-11 28L536-480l196 196q11 11 11 28t-11 28q-11 11-28 11t-28-11L480-424Z" />
        </svg></span>
    </button>
  </div>

  <!-- Filter Sections -->
  <div class="flex-1 overflow-y-auto p-4">

    <!-- Proveedor Section -->
    <div class="mb-4">
      <button (click)="toggleSection('provider')"
        class="w-full flex items-center justify-between py-3 text-left cursor-pointer">
        <div class="flex items-center gap-2 ">
          <span class="text-lg font-semibold text-marron-oscuro">Proveedor</span>
          <span *ngIf="getProviderIdsLength() > 0"
            class="bg-azul-claro border-1 border-marron-oscuro text-marron-oscuro text-xs px-2 py-1 h-6 w-6 rounded-full">
            {{ getProviderIdsLength() }}
          </span>
        </div>
        <span class="material-symbols-rounded text-marron-oscuro transition-transform h-7 w-7"
          [class.rotate-180]="isSectionOpen('provider')">

          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" fill="currentColor">
            <path
              d="M480-361q-8 0-15-2.5t-13-8.5L268-556q-11-11-11-28t11-28q11-11 28-11t28 11l156 156 156-156q11-11 28-11t28 11q11 11 11 28t-11 28L508-372q-6 6-13 8.5t-15 2.5Z" />
          </svg>
        </span>
      </button>

      <div class="overflow-hidden transition-[max-height] duration-500 ease-in-out mb-4" [ngClass]="{
          'max-h-[1000px]': isSectionOpen('provider'),
          'max-h-0': !isSectionOpen('provider')}">
        <div class="transition-opacity duration-300 ease-in-out" [class.opacity-0]="!isSectionOpen('provider')"
          [class.opacity-100]="isSectionOpen('provider')">
          <label *ngFor="let provider of providers"
            class="flex items-center gap-3 py-2 cursor-pointer hover:bg-gray-50 rounded px-2">
            <input type="checkbox" [checked]="isProviderSelected(provider.id)" (change)="toggleProvider(provider.id)"
              class="w-5 h-5 text-azul-claro rounded focus:ring-azul-claro focus:ring-2">
            <span class="text-marron-oscuro">{{ provider.company_name }}</span>
          </label>
        </div>
      </div>
    </div>

    <!-- Color Section -->
    <div class="mb-4 border-t border-gray-200 pt-4">
      <button (click)="toggleSection('color')"
        class="w-full flex items-center justify-between py-3 text-left cursor-pointer">
        <div class="flex items-center gap-2">
          <span class="text-lg font-semibold text-marron-oscuro">Color</span>
          <span *ngIf="getColorIdsLength() > 0"
            class="bg-azul-claro border-1 border-marron-oscuro text-marron-oscuro text-xs px-2 py-1 h-6 w-6 rounded-full">
            {{ getColorIdsLength() }}
          </span>
        </div>
        <span class="material-symbols-rounded text-marron-oscuro transition-transform h-7 w-7"
          [class.rotate-180]="isSectionOpen('color')">

          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"  fill="currentColor">
            <path
              d="M480-361q-8 0-15-2.5t-13-8.5L268-556q-11-11-11-28t11-28q11-11 28-11t28 11l156 156 156-156q11-11 28-11t28 11q11 11 11 28t-11 28L508-372q-6 6-13 8.5t-15 2.5Z" />
          </svg>
        </span>
      </button>

      <!-- <div *ngIf="isSectionOpen('color')" class="grid grid-cols-2 gap-3 mt-2"> -->
      <div class="mt-2 overflow-hidden transition-[max-height] duration-500 ease-in-out mb-4" [ngClass]="{
          'max-h-[1000px]': isSectionOpen('color'),
          'max-h-0': !isSectionOpen('color')}">
        <div class="grid grid-cols-2 gap-3 space-y-2 transition-opacity duration-300 ease-in-out"
          [class.opacity-0]="!isSectionOpen('color')" [class.opacity-100]="isSectionOpen('color')">
          <button *ngFor="let color of colors" (click)="toggleColor(color.id)"
            class="flex items-center gap-2 px-3 py-2 rounded-lg border-2 transition-all cursor-pointer hover:bg-gray-50"
            [class.border-azul-claro]="isColorSelected(color.id)" [class.bg-blue-50]="isColorSelected(color.id)"
            [class.border-gray-200]="!isColorSelected(color.id)">
            <div class="w-6 h-6 rounded" [style.background-color]="color.hex">
            </div>
            <span class="text-sm text-marron-oscuro">{{ color.name }}</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Dificultad Section -->
    <div class="mb-4 border-t border-gray-200 pt-4">
      <button (click)="toggleSection('difficulty')"
        class="w-full flex items-center justify-between py-3 text-left cursor-pointer">
        <div class="flex items-center gap-2">
          <span class="text-lg font-semibold text-marron-oscuro">Dificultad</span>
          <span *ngIf="getDifficultiesLength() > 0"
            class="bg-azul-claro border-1 border-marron-oscuro text-marron-oscuro text-xs px-2 py-1 h-6 w-6 rounded-full">
            {{ getDifficultiesLength() }}
          </span>
        </div>
        <span class="material-symbols-rounded text-marron-oscuro transition-transform h-7 w-7"
          [class.rotate-180]="isSectionOpen('difficulty')">
          <svg xmlns="http://www.w3.org/2000/svg"  viewBox="0 -960 960 960" 
            fill="currentColor">
            <path
              d="M480-361q-8 0-15-2.5t-13-8.5L268-556q-11-11-11-28t11-28q11-11 28-11t28 11l156 156 156-156q11-11 28-11t28 11q11 11 11 28t-11 28L508-372q-6 6-13 8.5t-15 2.5Z" />  
          </svg>
        </span>
      </button>

      <div class="overflow-hidden transition-[max-height] duration-500 ease-in-out mb-4" [ngClass]="{
          'max-h-[1000px]': isSectionOpen('difficulty'),
          'max-h-0': !isSectionOpen('difficulty')}">
        <div class=" space-y-2 transition-opacity duration-300 ease-in-out"
          [class.opacity-0]="!isSectionOpen('difficulty')" [class.opacity-100]="isSectionOpen('difficulty')">
          <button *ngFor="let diff of availableDifficulties" (click)="toggleDifficulty(diff.value)"
            class="w-full flex items-center gap-3 px-3 py-3 rounded-lg border-2 transition-all cursor-pointer hover:bg-gray-50"
            [class.border-azul-claro]="isDifficultySelected(diff.value)"
            [class.bg-blue-50]="isDifficultySelected(diff.value)"
            [class.border-gray-200]="!isDifficultySelected(diff.value)">
            <span class="text-marron-oscuro">{{ diff.label }}</span>
          </button>
        </div>
      </div>
    </div>

  </div>

  <!-- Footer Buttons -->
  <div class="border-t border-gray-200 p-4 flex gap-3">
    <button (click)="clearFilters()"
      class="flex-1 py-3 border-2 border-marron-oscuro text-marron-oscuro rounded-full font-semibold hover:bg-beige transition-colors cursor-pointer">
      LIMPIAR
    </button>
    <button (click)="applyFilters()"
      class="flex-1 py-3 bg-azul-claro border-2 border-marron-oscuro text-marron-oscuro rounded-full font-semibold hover:bg-beige transition-colors cursor-pointer">
      APLICAR
    </button>
  </div>
</div>
