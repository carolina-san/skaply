<article
  class="group flex flex-col overflow-hidden bg-marron-oscuro text-beige transition-transform duration-300 hover:-translate-y-1">

  <!-- Imagen principal -->
  <div class="relative w-full aspect-[5/4] overflow-hidden  bg-beige">
    <img
      [src]="'assets/imgs/estanteria3d.png'"
      [alt]="furniture.name"
      class="w-full h-full object-cover transition-transform duration-500 "
    >
  </div>

  <!-- Texto -->
  <section class="flex flex-col gap-1 p-3 pt-3">
     <p class="text-xs text-beige/70"> {{ furniture.reference_number }}</p>
    <h3 class="font-medium text-lg">{{ furniture.name }}</h3>
   

    <div class="flex justify-between items-center mt-1 text-xs text-beige/80">
      <span class="flex items-center gap-2">
        <span
          class="w-3.5 h-3.5 rounded-full border border-beige/20"
          [ngStyle]="{'background-color': furniture.color_hex}"
        ></span>
        {{ furniture.color_name }}
      </span>

      <span class="text-[11px] font-medium text-azul-claro/80">
        {{ difficultyLabels[furniture.difficulty] }}
      </span>
    </div>
  </section>
</article>
