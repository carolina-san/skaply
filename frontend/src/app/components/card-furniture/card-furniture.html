<article (click)="onCardClick()"
  class="group min-h-75 relative flex flex-col text-marron-oscuro rounded-2xl overflow-hidden bg-beige 
  transition-all duration-400 shadow-sm cursor-pointer
  hover:shadow-lg hover:scale-102 hover:bg-beige-oscuro">

  <!-- Imagen del mueble -->
  <div class="relative w-full aspect-[5/4] overflow-hidden ">
    <img [src]="furniture.image_url" 
      alt="{{ furniture.name }}" 
      class="w-full h-full object-cover object-center 
      transition-transform duration-400 
      group-hover:scale-105" />
  </div>

  <!-- Contenido -->
  <section class="flex flex-col gap-2 p-4">
    <h2 class="font-semibold text-base line-clamp-2">{{ furniture.name }}</h2>
    <p class="text-xs">{{ furniture.short_description }}</p>
  </section>
</article>
