<button class="btn-azul justify-between border border-marron-oscuro w-full" (click)="downloadPDF()"
    [disabled]="isDownloadingPdf">
    <p class="font-xs font-bold! ">{{ isDownloadingPdf ? '' : 'PDF' }}</p>
    <svg *ngIf="!isDownloadingPdf" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" fill="currentColor"
        class="w-5 sm:w-7 h-5 sm:h-7">
        <path d="M480-320 280-520l56-58 104 104v-326h80v326l104-104 56 58-200 200ZM160-160v-80h640v80H160Z" />
    </svg>
    <span *ngIf="isDownloadingPdf" class="loading-spinner" aria-hidden="true"></span>
</button>
