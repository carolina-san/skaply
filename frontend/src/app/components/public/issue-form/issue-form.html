<app-modal [open]="isOpen()" (openChange)="isOpen.set($event)">
    <div class="p-4 sm:p-6 space-y-6 !z-100">

        <h2 class="text-3xl font-bold text-marron-oscuro text-center sm:text-left">
            Reportar Incidencia
        </h2>

        <form (ngSubmit)="enviarIncidencia(incidenciaForm)" #incidenciaForm="ngForm" class="space-y-4">

            <!-- Referencia -->
            <div class="space-y-1">
                <label for="reference" class="block text-marron-oscuro font-medium">
                    Referencia del mueble:
                </label>

                <input id="reference" type="text" name="reference" [(ngModel)]="currentRef" required
                    #reference="ngModel" (blur)="checkReference(reference.value)" (input)="referenceError.set('')"
                    placeholder="Ej: 101" class="w-full px-3 py-2 rounded-lg border border-gray-300 bg-white
                 focus:outline-none focus:ring-2 focus:ring-marron-oscuro
                 transition disabled:bg-gray-100 disabled:opacity-70"
                    [class.border-red-500]="(reference.invalid && reference.touched) || referenceError()" />

                <div *ngIf="reference.invalid && reference.touched" class="text-red-500 text-xs">
                    La referencia es obligatoria
                </div>
                <div *ngIf="!reference.errors?.['required'] && referenceError()" class="text-red-500 text-xs">
                    {{ referenceError() }}
                </div>
            </div>

            <!-- Descripción -->
            <div class="space-y-1">
                <label for="descripcion" class="block text-marron-oscuro font-medium">
                    Descripción de la incidencia:
                </label>

                <textarea id="descripcion" name="descripcion" ngModel required rows="4" #descripcion="ngModel"
                    placeholder="Describe el problema..." class="w-full p-3 rounded-lg border border-gray-300 bg-white 
                 focus:outline-none focus:ring-2 focus:ring-marron-oscuro
                 transition" [class.border-red-500]="descripcion.invalid && descripcion.touched"></textarea>

                <div *ngIf="descripcion.invalid && descripcion.touched" class="text-red-500 text-xs">
                    La descripción es obligatoria
                </div>
            </div>

            <!-- Email -->
            <div class="space-y-1">
                <label for="email" class="block text-marron-oscuro font-medium">
                    Email (opcional):
                </label>

                <input id="email" type="email" name="email" ngModel email #email="ngModel"
                    placeholder="ejemplo@email.com" class="w-full p-3 rounded-lg border border-gray-300 bg-white
                 focus:outline-none focus:ring-2 focus:ring-marron-oscuro
                 transition" />

                <p class="text-xs text-marron-oscuro pt-2">
                    Si deseas recibir respuesta sobre esta incidencia.
                </p>
            </div>

            <!-- Botones -->
            <div class="flex flex-col gap-3 pt-3">

                <!-- Mensajes de estado -->
                <div *ngIf="submitStatus() === 'success'"
                    class="p-3 bg-green-100 border border-green-400 text-green-700 rounded-lg text-sm text-center">
                    {{ submitMessage() }}
                </div>

                <div *ngIf="submitStatus() === 'error'"
                    class="p-3 bg-red-100 border border-red-400 text-red-700 rounded-lg text-sm text-center">
                    {{ submitMessage() }}
                </div>

                <div class="flex justify-end gap-3" *ngIf="submitStatus() !== 'success'">
                    <button type="button" (click)="clearModal()" class="px-4 py-2 rounded-lg bg-azul-claro text-marron-oscuro
                        hover:bg-gray-300 transition">
                        Cancelar
                    </button>

                    <button type="submit" class="px-4 py-2 rounded-lg bg-marron-oscuro text-white
                        hover:bg-marron-claro transition shadow-sm
                        disabled:opacity-50 disabled:cursor-not-allowed"
                        [disabled]="incidenciaForm.invalid || isSubmitting() || referenceError()">

                        {{ isSubmitting() ? 'Enviando...' : 'Enviar' }}

                    </button>
                </div>
            </div>

        </form>
    </div>
</app-modal>
