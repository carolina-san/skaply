@if (active()) {
<div class="fixed inset-0 bg-black/55 z-[115]" (click)="closeAction.emit()"></div>

@if (targetRect(); as rect) {
<div
  class="fixed z-[116] rounded-[14px] border-2 border-[#bad5e3] shadow-[0_0_0_4px_rgba(186,213,227,0.28)] pointer-events-none transition-all duration-[120ms] ease-in-out"
  [style.top.px]="rect.top - 8" [style.left.px]="rect.left - 8" [style.width.px]="rect.width + 16"
  [style.height.px]="rect.height + 16"></div>
}

<div
  class="fixed space-y-3 z-[117] top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[min(360px,calc(100vw-24px))] bg-[var(--color-beige)] border border-marron-oscuro/20 rounded-[14px] p-[14px] text-marron-oscuro shadow-[0_12px_32px_rgba(0,0,0,0.3)] space-y-2 "
  [style.left.px]="panelCenterX()" (click)="$event.stopPropagation()">
  <button (click)="closeAction.emit()" type="button"
    class="absolute top-2 right-2 text-marron-oscuro/70 hover:text-marron-oscuro transition-colors ">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"
      stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
    </svg>
  </button>

  <p class="text-xs text-marron-oscuro/70 mb-2 text-center">Paso {{ stepIndex() + 1 }} de {{ stepCount() }}</p>
  <h3 class="text-lg font-bold mb-3 text-center">{{ title() }}</h3>
  <p class="text-sm  text-center">{{ description() }}</p>

  <div class="mt-4 flex justify-center items-center gap-2">
    <button
      class="rounded-full px-3 py-1.5 text-sm font-semibold border border-marron-oscuro/35 transition-all duration-200 ease-in-out bg-[var(--color-beige-oscuro)] text-marron-oscuro disabled:opacity-50 disabled:cursor-not-allowed hover:bg-beige-oscuro disabled:hover:bg-[var(--color-beige-oscuro)]"
      (click)="prevAction.emit()" [disabled]="stepIndex() === 0">
      Anterior
    </button>
    <button
      class="rounded-full px-3 py-1.5 text-sm font-semibold border border-marron-oscuro/45 transition-all duration-200 ease-in-out bg-[#bad5e3] text-marron-oscuro disabled:opacity-50 disabled:cursor-not-allowed hover:bg-beige-oscuro disabled:hover:bg-[#bad5e3]"
      (click)="nextAction.emit()">
      {{ stepIndex() + 1 === stepCount() ? 'Finalizar' : 'Siguiente' }}
    </button>
  </div>
</div>
}
