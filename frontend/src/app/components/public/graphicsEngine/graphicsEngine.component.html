<div #engineShell class="w-full h-full  flex flex-col p-2 sm:px-4 border-0 shadow-none transition-colors duration-300"
  [ngClass]="isWhiteBg() ? 'bg-white' : 'bg-transparent'">

  <app-graphics-header *ngIf="!isARActive()" [engineUse]="engineUse()" [furnitureName]="furnitureName()" [mode]="mode()"
    [visibleSteps]="visibleSteps()" [currentLogicalStep]="logicalStep()" [hasIsolatedPart]="isolatedPart() !== null"
    [isolatedPartName]="isolatedPart()?.name || ''" [isSimulating]="isSimulating()"
    [isManualComplete]="isManualComplete()" [stepDescriptions]="stepDescriptions()" [isWhiteBg]="isWhiteBg()"
    [isSingleModel]="totalSteps() <= 1" (engineChanged)="onEngineChange($event)" (goToStepAction)="goToStep($event)"
    (exitIsolationAction)="exitIsolation()" (startTourAction)="startTour()">
  </app-graphics-header>



  <!-- Canvas Container-->
  <div class="relative h-full" [ngClass]="isARActive() ? 'fixed inset-0 z-10' : 'relative h-full'">
    <app-ar-overlay [isSmallScreen]="isSmallScreen()" [mode]="mode()" [hasIsolatedPart]="isolatedPart() !== null"
      (arStateChange)="onArStateChange($event)"></app-ar-overlay>

    <!-- Main Canvas -->
    <canvas #canvas class="absolute top-0 left-0 w-full h-full cursor-grab active:cursor-grabbing"
      style="touch-action: none; overscroll-behavior: none; outline: none;">
    </canvas>

    <!-- Loading Spinner -->
    @if (isLoading()) {
    <app-spinner message="Cargando entorno 3D..."></app-spinner>
    }

    @if (isolatedPart(); as part) {
    }

    <!-- Reset Button -->
    @if (isCameraMoved() && mode() !== 'simulation') {
    <button *ngIf="!isARActive()" (click)="resetCameraPosition()"
      class="absolute bottom-1 left-0 flex px-3 py-2 bg-beige justify-center items-center rounded-full transition-all duration-200 transform hover:scale-105 z-50 shadow-lg text-marron-oscuro hover:bg-marron-claro hover:text-beige"
      [class.border]="isWhiteBg()" [class.border-marron-oscuro]="isWhiteBg()">
      <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px" fill="currentColor">
        <path
          d="M480-360v-60q0-25 17.5-42.5T540-480h60L480-360Zm0 161v-85l196-196h85L480-199Zm2 75 353-354q16 4 27.5 15.5T878-435L524-82q-16-5-26.5-15.5T482-124Zm117 44 281-281v85L684-80h-85Zm161 0 120-120v60q0 25-17.5 42.5T820-80h-60ZM480-760q-117 0-198.5 81.5T200-480q0 72 32.5 132t87.5 98v-70q0-17 11.5-28.5T360-360q17 0 28.5 11.5T400-320v160q0 17-11.5 28.5T360-120H200q-17 0-28.5-11.5T160-160q0-17 11.5-28.5T200-200h54q-62-50-98-122.5T120-480q0-75 28.5-140.5t77-114q48.5-48.5 114-77T480-840q114 0 204 62.5T814-615q6 16 0 31t-22 21q-16 6-31.5 0T739-585q-31-78-100-126.5T480-760Z" />
      </svg>
    </button>
    }

  </div>


  <!-- Footer Controls -->
  @if(showFooterControls() && !isARActive()) {
  <app-footer-controls [hasIsolatedPart]="isolatedPart() !== null" [mode]="mode()" [manualStep]="manualStep()"
    [totalSteps]="totalSteps()" [isSimulationPaused]="isSimulationPaused()" [simulationSpeed]="simulationSpeed()"
    [lastCommand]="voiceControlService.lastCommand()" [isVoiceListening]="voiceControlService.isListening()"
    [isVoiceSupported]="voiceControlService.isSupported()" [isVoiceSoundActive]="voiceControlService.isSoundActive()"
    [micFlowState]="voiceControlService.micFlowState()" [isWhiteBg]="isWhiteBg()" [isLoading]="isLoading()"
    (modeChange)="setMode($event)" (goToStepAction)="goToStep($event)" (prevStepAction)="prevStep()"
    (nextStepAction)="nextStep()" (togglePauseAction)="togglePause()" (speedChange)="setSimulationSpeed($event)"
    (finishAction)="openFinishModal()" (toggleVoiceAction)="voiceControlService.toggle()"
    (toggleBgColorAction)="isWhiteBg.set(!isWhiteBg())"
    (proceedMicPermission)="voiceControlService.proceedWithMicPermission()"
    (cancelMicPermission)="voiceControlService.cancelMicPermission()"
    (closeMicDenied)="voiceControlService.closeMicDenied()"
    (retryMicPermission)="voiceControlService.retryMicPermission()">
  </app-footer-controls>
  }

  <app-graphics-tour-overlay [active]="tourActive()" [targetRect]="tourTargetRect()"
    [panelCenterX]="tourPanelCenterX()" [stepIndex]="tourStepIndex()" [stepCount]="tourStepCount"
    [title]="tourCurrentStep().title" [description]="tourCurrentStep().description"
    (closeAction)="closeTour()" (prevAction)="prevTourStep()" (nextAction)="nextTourStep()">
  </app-graphics-tour-overlay>
</div>
