<article (click)="onCardClick()" class="group min-h-40 h-full max-h-80 relative flex flex-col text-marron-oscuro rounded-2xl overflow-hidden bg-beige 
  transition-all duration-400 shadow-sm cursor-pointer
  hover:shadow-lg hover:scale-102 hover:bg-beige-oscuro">

  <!-- Imagen del mueble -->
  <div class="relative w-full aspect-[5.5/4] overflow-hidden shrink-0">
    <img [src]="furniture.image_url" alt="{{ furniture.name }}" class="w-full h-full object-cover object-center 
      transition-transform duration-400 
      group-hover:scale-105" />
    <span
      class="absolute  top-2 right-2 bg-azul-claro/80 backdrop-blur-sm px-2 py-0.5 rounded-full text-[10px] font-bold text-marron-secundario shadow ">
      {{ furniture.reference_number }}
    </span>
    <!-- Indicador de montaje -->
    <span *ngIf="furniture.total_steps && furniture.total_steps > 0"
      class="absolute top-2 left-2 bg-marron-oscuro/75 backdrop-blur-sm p-1.5 rounded-full text-beige shadow flex items-center justify-center"
      title="Montaje disponible ({{ furniture.total_steps }} pasos)">

      <svg xmlns="http://www.w3.org/2000/svg" height="14px" viewBox="0 -960 960 960" width="14px" fill="currentColor">
        <path
          d="M739-83.5q-7-2.5-13-8.5L522-296q-6-6-8.5-13t-2.5-15q0-8 2.5-15t8.5-13l85-85q6-6 13-8.5t15-2.5q8 0 15 2.5t13 8.5l204 204q6 6 8.5 13t2.5 15q0 8-2.5 15t-8.5 13l-85 85q-6 6-13 8.5T754-81q-8 0-15-2.5Zm15-92.5 29-29-147-147-29 29 147 147ZM189.5-83q-7.5-3-13.5-9l-84-84q-6-6-9-13.5T80-205q0-8 3-15t9-13l212-212h85l34-34-165-165h-57L80-765l113-113 121 121v57l165 165 116-116-43-43 56-56H495l-28-28 142-142 28 28v113l56-56 142 142q17 17 26 38.5t9 45.5q0 24-9 46t-26 39l-85-85-56 56-42-42-207 207v84L233-92q-6 6-13 9t-15 3q-8 0-15.5-3Zm15.5-93 170-170v-29h-29L176-205l29 29Zm0 0-29-29 15 14 14 15Zm549 0 29-29-29 29Z" />
      </svg>
    </span>
  </div>

  <!-- Contenido -->
  <section class="flex flex-col gap-2 p-4 flex-grow">
    <div class="flex items-start justify-between flex-col">
      <h2 class="font-semibold line-clamp-2 leading-tight">{{ furniture.name }}</h2>

    </div>
    <div class="flex items-start gap-1 text-xs font-bold uppercase tracking-wide text-marron-oscuro/80"
      *ngIf="furniture.provider_name">

      <svg xmlns="http://www.w3.org/2000/svg" height="14px" viewBox="0 -960 960 960" width="14px" fill="currentColor">
        <path
          d="M160-120q-33 0-56.5-23.5T80-200v-440q0-33 23.5-56.5T160-720h160v-80q0-33 23.5-56.5T400-880h160q33 0 56.5 23.5T640-800v80h160q33 0 56.5 23.5T880-640v440q0 33-23.5 56.5T800-120H160Zm0-80h640v-440H160v440Zm240-520h160v-80H400v80ZM160-200v-440 440Z" />
      </svg>
      <span class="text-xs font-bold uppercase tracking-wider text-marron-oscuro/80">{{ furniture.provider_name
        }}</span>
    </div>

    <div class="relative flex-1 overflow-hidden min-h-0 pt-1">
      <p class="text-xs text-marron-oscuro/80" title="{{ furniture.short_description }}">
        {{ furniture.short_description }}
      </p>

    </div>
    <div
      class="absolute bottom-0 left-0 right-0 h-15 bg-gradient-to-t from-beige group-hover:from-beige-oscuro to-transparent pointer-events-none transition-colors duration-400">
    </div>

  </section>
</article>
