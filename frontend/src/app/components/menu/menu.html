<div class="lg:hidden relative items-center ">
  <!-- Botón hamburguesa -->
  <span (click)="abrir()"
      class="fixed text-azul-claro material-symbols-rounded cursor-pointer text-3xl right-5 top-5">
    menu
  </span>

  <!-- Menú lateral -->
  <nav class="fixed items-center top-0 right-0 w-50  bg-beige shadow-xl transform transition-transform duration-300 z-50 p-6"
     [ngClass]="{ 'translate-x-0': menuAbierto, 'translate-x-full': !menuAbierto }">

      <button class="fixed items-center top-2 right-5 text-marron-oscuro text-3xl cursor-pointer" (click)="cerrar()">
          &times;
      </button>

      <ul class="pt-10 space-y-4 text-marron-oscuro">
          <li><a href="https://skaply.ovh/lynk" class="hover:text-azul-claro">Conoce al Equipo</a></li>
          <li><a routerLink="/catalogo" class="hover:text-azul-claro">Accede a Skäply</a></li>
      </ul>
  </nav>
</div>


<!-- menu desplegado -->

<nav

>
 <a

  >
