<!-- Fondo negro semitransparente -->
<div 
  *ngIf="open"
  class="fixed inset-0 bg-black/50 z-40"
  (click)="close()"
></div>

<!-- Modal -->
<div 
  *ngIf="open"
  class="fixed bottom-0 left-0 w-full z-50 
         sm:w-[32rem] sm:left-1/2 sm:-translate-x-1/2 sm:top-1/2 sm:-translate-y-1/2
         h-[90vh] sm:h-[500px] sm:max-h-[90vh]
         transition-all duration-300"
>
  <div class="bg-beige rounded-t-3xl sm:rounded-xl shadow-2xl flex flex-col h-full w-full p-6 overflow-hidden">

    <!-- HEADER -->
    <header class="flex justify-between items-center mb-4">
      <h2 *ngIf="title" class="text-xl font-semibold">{{ title }}</h2>

      <button (click)="close()" class="text-gray-500 hover:text-black">
        ✕
      </button>
    </header>

    <!-- CONTENIDO -->
    <div class="flex-1 overflow-y-auto">
      <ng-content></ng-content>
    </div>

  </div>
</div>
