<div class="w-full max-w-4xl h-64 lg:h-80 mx-4 mb-6 relative rounded-2xl overflow-hidden">
    <canvas #canvas class="w-full h-full block"></canvas>

    <!-- Cargando -->
    <div *ngIf="isLoading" class="absolute inset-0 flex items-center justify-center z-20 rounded-2xl animate-fade-in">
        <div class="text-center">
            <div class="w-10 h-10 md:w-8 md:h-8 border-3 border-azul-claro border-t-transparent rounded-full mx-auto animate-spin"></div>
            <p class="text-beige mt-4">Cargando modelo 3D...</p>
        </div>
    </div>
</div>
