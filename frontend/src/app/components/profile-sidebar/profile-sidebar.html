<div class="h-[100dvh] bg-marron-oscuro text-white flex flex-col p-5 pt-30 w-full items-center">
    <!-- Admin Info Section -->
    <div *ngIf="currentUser" class="flex flex-col items-center gap-6 mb-8 w-full">
        <!-- Avatar Placeholder con botón de editar -->
        <div class="relative w-full">
            <img *ngIf="currentUser.image_url" src="{{ currentUser.image_url }}" alt="Avatar"
                class="w-full h-35 rounded-xl object-cover">
            <div *ngIf="!currentUser.image_url"
                class="w-full h-35 rounded-xl flex items-center justify-center border border-beige uppercase">
                <svg xmlns="http://www.w3.org/2000/svg" height="45px" viewBox="0 -960 960 960" width="45px"
                    fill="#FFFFFF">
                    <path
                        d="M367-527q-47-47-47-113t47-113q47-47 113-47t113 47q47 47 47 113t-47 113q-47 47-113 47t-113-47ZM160-240v-32q0-34 17.5-62.5T224-378q62-31 126-46.5T480-440q66 0 130 15.5T736-378q29 15 46.5 43.5T800-272v32q0 33-23.5 56.5T720-160H240q-33 0-56.5-23.5T160-240Zm80 0h480v-32q0-11-5.5-20T700-306q-54-27-109-40.5T480-360q-56 0-111 13.5T260-306q-9 5-14.5 14t-5.5 20v32Zm296.5-343.5Q560-607 560-640t-23.5-56.5Q513-720 480-720t-56.5 23.5Q400-673 400-640t23.5 56.5Q447-560 480-560t56.5-23.5ZM480-640Zm0 400Z" />
                </svg>
            </div>

            <!-- Edit Icon -->
            <button (click)="openEditModal()"
                class="absolute -top-3 -right-3 bg-azul-claro hover:bg-azul-claro/80 text-marron-oscuro rounded-full p-2 transition-colors duration-200"
                title="Editar perfil">
                <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px"
                    fill="currentColor">
                    <path
                        d="M200-200h57l391-391-57-57-391 391v57Zm-80 80v-170l528-527q12-11 26.5-17t30.5-6q16 0 31 6t26 18l55 56q12 11 17.5 26t5.5 30q0 16-5.5 30.5T817-647L290-120H120Zm640-584-56-56 56 56Zm-141 85-28-29 57 57-29-28Z" />
                </svg>
            </button>
        </div>

        <!-- User Info -->
        <div class="text-center">
            <h2 class="text-xl font-semibold">{{ currentUser.company_name || 'Administrador' }}</h2>
            <p class="text-md mt-1 text-gray-300">{{ currentUser.email }}</p>
            <span
                class="inline-block mt-2 px-3 py-1 bg-azul-claro text-marron-oscuro text-xs font-medium rounded-full uppercase">
                {{ currentUser.role }}
            </span>
        </div>


    </div>
    <div class="flex flex-row gap-2 mb-3 w-full">
        <div *ngIf="currentUser?.role === 'admin'"
            class="mt-6 w-full bg-white/10 p-4 rounded-xl flex flex-col items-left border border-white/10">
            <h4 class="text-gray-300 text-sm font-medium uppercase  mb-1">Proveedores</h4>
            <p class="text-3xl font-bold text-azul-claro">{{ totalProviders }}</p>
        </div>
        <div class="mt-6 w-full bg-white/10 p-4 rounded-xl flex flex-col items-left border border-white/10">
            <h4 class="text-gray-300 text-sm font-medium uppercase  mb-1">Muebles</h4>
            <p class="text-3xl font-bold text-azul-claro">{{ totalFurniture }}</p>
        </div>
    </div>
    <button (click)="logout()" class="btn-beige w-[80%] self-center mt-auto">
        Cerrar sesión
        <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px" fill="currentColor">
            <path
                d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h280v80H200v560h280v80H200Zm440-160-55-58 102-102H360v-80h327L585-622l55-58 200 200-200 200Z" />
        </svg>
    </button>
</div>

<!-- Modal de edición de perfil -->
<app-modal [(open)]="isEditModalOpen">
    <div class="bg-white rounded-xl">
        <div class="px-6 py-4 border-b border-gray-200">
            <h2 class="text-xl font-bold text-marron-oscuro">Editar Perfil</h2>
        </div>

        <form [formGroup]="editForm" (ngSubmit)="onSubmit()" class="p-6 space-y-4">
                <div class="flex items-center gap-4">
                    <div class="relative group w-20 h-20 rounded-xl overflow-hidden border-2 border-gray-300 flex-shrink-0">
                        <img *ngIf="imagePreview || currentUser?.image_url"
                            [src]="imagePreview || currentUser?.image_url"
                            alt="Preview"
                            class="w-full h-full object-cover" />

                        <div *ngIf="!imagePreview && !currentUser?.image_url"
                            class="w-full h-full bg-gray-100 flex items-center justify-center">
                            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#9CA3AF">
                                <path d="M480-480q-66 0-113-47t-47-113q0-66 47-113t113-47q66 0 113 47t47 113q0 66-47 113t-113 47ZM160-160v-112q0-34 17.5-62.5T224-378q62-31 126-46.5T480-440q66 0 130 15.5T736-378q29 15 46.5 43.5T800-272v112H160Z"/>
                            </svg>
                        </div>

                        <label for="profileImage" class="absolute inset-0 bg-black/50 opacity-0
                            group-hover:opacity-100 flex items-center justify-center text-white 
                            cursor-pointer transition text-xs font-medium">
                            Cambiar
                        </label>

                        <input id="profileImage" type="file" accept="image/*" 
                               (change)="onImageSelected($event)" class="hidden" />
                    </div>

                    <div class="flex-1">
                        <button type="button" (click)="removeImage()" *ngIf="imagePreview"
                            class="text-sm text-red-600 hover:underline mb-1">
                            Eliminar
                        </button>
                        <p class="text-xs text-gray-500">JPG, PNG o GIF (máx 2MB)</p>
                    </div>
                </div>

            <!-- Información personal -->
            <div class="space-y-3">
                <div *ngIf="currentUser?.role === 'provider'">
                    <label class="label">Empresa</label>
                    <input type="text" formControlName="company_name" 
                           class="input" placeholder="Nombre de la empresa" />
                </div>

                <div *ngIf="currentUser?.role === 'admin'">
                    <label class="label">Nombre</label>
                    <input type="text" formControlName="name" 
                           class="input" placeholder="Tu nombre" />
                </div>
                <div>
                    <label class="label">Email</label>
                    <input type="email" formControlName="email" 
                           class="input" placeholder="tu@email.com" />
                    <p *ngIf="editForm.get('email')?.invalid && editForm.get('email')?.touched" 
                       class="error">Email inválido</p>
                </div>
                <div>
                    <label class="label">Teléfono</label>
                    <input type="tel" formControlName="telephone" 
                           class="input" placeholder="+34 123 456 789" />
                </div>
                <div>
                    <label class="label">Nueva contraseña (opcional)</label>
                    <input type="password" formControlName="password" 
                           placeholder="Dejar vacío para mantener la actual"
                           class="input" />
                    <p *ngIf="editForm.get('password')?.invalid && editForm.get('password')?.touched" 
                       class="error">Mínimo 6 caracteres</p>
                </div>
            </div>
            <div *ngIf="errorMessage" class="alert-error">
                {{ errorMessage }}
            </div>

            <div *ngIf="successMessage" class="alert-success">
                {{ successMessage }}
            </div>
            <div class="flex justify-end gap-3 pt-3 border-t border-gray-200">
                <button type="button" (click)="closeEditModal()"
                    class="px-4 py-2 border border-gray-300 rounded-lg text-marron-oscuro 
                           hover:bg-gray-50 transition text-sm">
                    Cancelar
                </button>

                <button type="submit" [disabled]="isSubmitting || !hasChanges" 
                    class="px-5 py-2 bg-marron-oscuro text-white rounded-lg
                           hover:bg-marron-oscuro/90 disabled:opacity-50 
                           disabled:cursor-not-allowed transition text-sm">
                    {{ isSubmitting ? 'Guardando...' : 'Guardar' }}
                </button>
            </div>
        </form>
    </div>
</app-modal>
