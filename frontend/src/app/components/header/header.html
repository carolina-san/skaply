<header class="fixed flex bg-marron-oscuro/60 backdrop-blur-md 
  shadow-md justify-between lg:justify-between items-center pl-5 lg:px-20 py-2 z-30 w-full">
  <button *ngIf="currentRoute !== '/'" (click)="goBack()" class="absolute left-7 top-5 text-beige">
    <span class="material-symbols-rounded">arrow_back_ios</span>
  </button>

  <img *ngIf="currentRoute == '/'" (click)="scrollToTop()" src="assets/skaply_azul.svg" alt="logo skaply" class="w-40 lg:w-50
  transition-all duration-300  hover:scale-105 cursor-pointer " />
  <img *ngIf="currentRoute !== '/'" src="assets/skaply_azul.svg" alt="logo skaply" class="w-30 lg:w-50">

  <!-- Menú si está en la landing -->
  <app-menu *ngIf="currentRoute == '/'" [menuAbierto]="menuAbierto" (abrirMenu)="menuAbierto = true"
    (cerrarMenu)="menuAbierto = false">
  </app-menu>

</header>
