<header
  class="relative flex justify-center lg:justify-start items-start py-4 px-3 w-full z-30 bg-marron-oscuro">
  <button *ngIf="currentRoute !== '/'" (click)="goBack()" class="absolute left-7 top-5 text-beige">
    <span class="material-symbols-rounded">arrow_back_ios</span>
  </button>


  <img src="assets/skaply_azul.svg" alt="logo skaply" class="w-30 lg:w-50 lg:ml-3">

  <!-- Menú si está en la landing -->
 <app-menu 
    *ngIf="currentRoute == '/'"
  [menuAbierto]="menuAbierto" 
  (abrirMenu)="menuAbierto = true" 
  (cerrarMenu)="menuAbierto = false">
</app-menu>
</header>
