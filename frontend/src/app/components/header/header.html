<!-- Mejoras: que solo salga el borde y se ahga un poco más estrecho cuando hagas scroll -->
<header [ngClass]="{
    'sticky top-0 bg-marron-oscuro/50 backdrop-blur-md shadow-md border-b border-beige/20': currentRoute === '/',
    'relative': currentRoute !== '/'
  }" class="flex items-center pl-5 lg:px-20 py-2 w-full z-30 transition-all duration-300
         justify-center lg:justify-between shadow-xl bg-marron-oscuro">
  <button *ngIf="currentRoute !== '/'" (click)="goBack()"
    class="absolute left-10 top-6 lg:top-7 text-beige cursor-pointer ">
    <span class="material-symbols-rounded">
      <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor">
        <path
          d="m382-480 294 294q15 15 14.5 35T675-116q-15 15-35 15t-35-15L297-423q-12-12-18-27t-6-30q0-15 6-30t18-27l308-308q15-15 35.5-14.5T676-844q15 15 15 35t-15 35L382-480Z" />
      </svg></span>
  </button>

  <div class="logo-container w-40 lg:w-50 cursor-pointer" (click)="scrollToTop()">
    <!-- Logo normal -->
    <img src="assets/skaply_azul.svg" alt="logo normal"
      class="logo-normal w-full h-auto transition-opacity duration-500" />

    <!-- Logo reducido -->
    <img src="assets/reducido.svg" alt="logo reducido"
      class="logo-hover w-17 h-auto opacity-0 transition-opacity duration-500 absolute top-[-2px] left-15" />
  </div>

  <!-- Menú si está en la landing -->
  <app-menu *ngIf="currentRoute == '/'"></app-menu>

  <a *ngIf="currentRoute !== '/'" href="/login" class="hidden lg:flex items-center justify-center absolute right-10
          bg-azul-claro rounded-full h-10 w-10 text-marron-oscuro font-semibold
          hover:bg-beige transition duration-300 cursor-pointer">
    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#452621">
      <path
        d="M480-480q-66 0-113-47t-47-113q0-66 47-113t113-47q66 0 113 47t47 113q0 66-47 113t-113 47ZM160-160v-112q0-34 17.5-62.5T224-378q62-31 126-46.5T480-440q66 0 130 15.5T736-378q29 15 46.5 43.5T800-272v112H160Zm80-80h480v-32q0-11-5.5-20T700-306q-54-27-109-40.5T480-360q-56 0-111 13.5T260-306q-9 5-14.5 14t-5.5 20v32Zm240-320q33 0 56.5-23.5T560-640q0-33-23.5-56.5T480-720q-33 0-56.5 23.5T400-640q0 33 23.5 56.5T480-560Zm0-80Zm0 400Z" />
    </svg>
  </a>
</header>
