<div class="h-screen bg-marron-oscuro text-white flex flex-col p-6 pt-30">
    <!-- Admin Info Section -->
    <div *ngIf="currentUser" class="flex flex-col items-center gap-4 mb-8">
        <!-- Avatar Placeholder -->
        <div
            class="w-24 h-24 rounded-full bg-azul-claro flex items-center justify-center text-marron-oscuro text-3xl font-bold uppercase">
            {{ currentUser.emailuser.charAt(0) }}
        </div>

        <!-- User Info -->
        <div class="text-center">
            <h2 class="text-lg font-semibold">{{ currentUser.company_name || 'Administrador' }}</h2>
            <p class="text-sm text-gray-300">{{ currentUser.emailuser }}</p>
            <span
                class="inline-block mt-2 px-3 py-1 bg-azul-claro text-marron-oscuro text-xs font-medium rounded-full uppercase">
                {{ currentUser.role }}
            </span>
        </div>
    </div>

    <nav class="flex-1 flex flex-col gap-2">
        <a class="px-4 py-3 rounded-lg hover:bg-white/10 transition cursor-pointer flex items-center gap-3">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#FFFFFF">
                <path
                    d="M680-160q-17 0-28.5-11.5T640-200v-200q0-17 11.5-28.5T680-440h80q17 0 28.5 11.5T800-400v200q0 17-11.5 28.5T760-160h-80Zm-240 0q-17 0-28.5-11.5T400-200v-560q0-17 11.5-28.5T440-800h80q17 0 28.5 11.5T560-760v560q0 17-11.5 28.5T520-160h-80Zm-240 0q-17 0-28.5-11.5T160-200v-360q0-17 11.5-28.5T200-600h80q17 0 28.5 11.5T320-560v360q0 17-11.5 28.5T280-160h-80Z" />
            </svg>
            Estadísiticas
        </a>
        <a class="px-4 py-3 rounded-lg hover:bg-white/10 transition cursor-pointer flex items-center gap-3">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#FFFFFF">
                <path
                    d="M200-120q-17 0-28.5-11.5T160-160v-40q-50 0-85-35t-35-85v-200q0-50 35-85t85-35v-80q0-50 35-85t85-35h400q50 0 85 35t35 85v80q50 0 85 35t35 85v200q0 50-35 85t-85 35v40q0 17-11.5 28.5T760-120q-17 0-28.5-11.5T720-160v-40H240v40q0 17-11.5 28.5T200-120Zm-40-160h640q17 0 28.5-11.5T840-320v-200q0-17-11.5-28.5T800-560q-17 0-28.5 11.5T760-520v160H200v-160q0-17-11.5-28.5T160-560q-17 0-28.5 11.5T120-520v200q0 17 11.5 28.5T160-280Zm120-160h400v-80q0-27 11-49t29-39v-112q0-17-11.5-28.5T680-760H280q-17 0-28.5 11.5T240-720v112q18 17 29 39t11 49v80Zm200 0Zm0 160Zm0-80Z" />
            </svg>
            Muebles
        </a>
        <a class="px-4 py-3 rounded-lg hover:bg-white/10 transition cursor-pointer flex items-center gap-3">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#FFFFFF">
                <path
                    d="M480-280q17 0 28.5-11.5T520-320q0-17-11.5-28.5T480-360q-17 0-28.5 11.5T440-320q0 17 11.5 28.5T480-280Zm0-160q17 0 28.5-11.5T520-480v-160q0-17-11.5-28.5T480-680q-17 0-28.5 11.5T440-640v160q0 17 11.5 28.5T480-440ZM363-120q-16 0-30.5-6T307-143L143-307q-11-11-17-25.5t-6-30.5v-234q0-16 6-30.5t17-25.5l164-164q11-11 25.5-17t30.5-6h234q16 0 30.5 6t25.5 17l164 164q11 11 17 25.5t6 30.5v234q0 16-6 30.5T817-307L653-143q-11 11-25.5 17t-30.5 6H363Zm1-80h232l164-164v-232L596-760H364L200-596v232l164 164Zm116-280Z" />
            </svg>
            Incidencias
        </a>
    </nav>

    <button (click)="logout()"
        class="mt-auto px-4 py-3 rounded-full bg-beige hover:bg-beige/80 transition flex flex-row items-center gap-3 text-marron-oscuro flex-wrap">
        <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px" fill="currentColor">
            <path
                d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h280v80H200v560h280v80H200Zm440-160-55-58 102-102H360v-80h327L585-622l55-58 200 200-200 200Z" />
        </svg>
        Cerrar sesión
    </button>
</div>
