<button (click)="openScanner()" class="btn-escaneo">
    <span class="material-symbols-rounded text-3xl text-marron-oscuro">add</span>
</button>


<aside *ngIf="isOpen" class="fixed bottom-6 right-24 z-80" (click)="closeScanner()">

  <article class="w-72 bg-white rounded-3xl shadow-2xl p-2 border border-gray-100 animate-pop" (click)="$event.stopPropagation()">

    <!-- Introducir clave -->
    <button (click)="toggleManualInput()" class="w-full flex items-center justify-between px-5 py-4">
      <input class="text-marron-oscuro" placeholder="Introducir num referencia"/>
      <span class="material-symbols-rounded text-marron-oscuro text-2xl">keyboard</span>
    </button>

    <!-- Escanear QR -->
    <button (click)="startScanning()" class="w-full flex items-center justify-between px-5 py-4 hover:bg-gray-100 rounded-xl transition mt-1">
      <span class="text-marron-oscuro">Escanear un código QR</span>
      <span class="material-symbols-rounded text-marron-oscuro text-2xl">photo_camera</span>
    </button>

  </article>
</aside>
