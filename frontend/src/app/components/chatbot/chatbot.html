<div class="fixed bottom-0 left-0 w-full z-50 sm:w-96 sm:left-auto sm:right-6 transition-all duration-400"
    [ngClass]="chatVisible ? 'h-[90vh]' : 'h-20'">

    <button *ngIf="!chatVisible"
        class="absolute bottom-28 right-6 bg-beige text-marron-oscuro p-4 rounded-full shadow-lg hover:scale-110 transition-transform"
        (click)="toggleChat()">
        <span class="material-symbols-rounded">chat</span>
    </button>

    <div *ngIf="chatVisible" class="bg-beige rounded-t-3xl overflow-hidden shadow-2xl flex flex-col h-full w-full page-main py-4 ">

        <header class="flex justify-between items-center">

            <h2 class="text-2xl font-semibold text-marron-oscuro">Allen</h2>

            <button (click)="toggleChat()"
                class="btn-hover-marron">
                <svg xmlns="http://www.w3.org/2000/svg" height="30px" viewBox="0 -960 960 960" width="30px"
                    fill="var(--color-marron-secundario)">
                    <path d="M480-361q-8 0-15-2.5t-13-8.5L268-556q-11-11-11-28t11-28q11-11 28-11t28 11l156 156 
                    156-156q11-11 28-11t28 11q11 11 11 28t-11 28L508-372q-6 6-13 8.5t-15 2.5Z" />
                </svg>
            </button>
        </header>

        <div class="flex-1 overflow-y-auto p-4 bg-beige">
            <div *ngFor="let msg of messages" class="mb-2" [ngClass]="{
                'text-right': msg.sender === 'user',
                'text-left': msg.sender === 'bot'
                }">
                <div *ngIf="msg.rich?.type === 'card'" class="msg-bot border p-3 rounded-md shadow mb-2 bg-white">
                    <img *ngIf="msg.rich.imageUri" [src]="msg.rich.imageUri" alt="Card image"
                        class="w-full h-32 object-cover rounded-md mb-2">
                    <h4 class="font-bold">{{ msg.rich.title }}</h4>
                    <p class="text-sm text-gray-700 whitespace-pre-line">{{ msg.rich.subtitle }}</p>
                    <div class="mt-2">
                        <button *ngFor="let btn of msg.rich.buttons"
                            class="bg-blue-500 text-white px-3 py-1 m-1 rounded hover:bg-blue-600 transition"
                            (click)="openLink(btn.postback)">
                            {{ btn.text }}
                        </button>
                    </div>
                </div>
                <!-- Mensaje normal -->
                <div *ngIf="msg.text" [ngClass]="msg.sender === 'user'
                    ? 'msg-user'
                    : 'msg-bot'">
                    {{ msg.text }}
                </div>

                <!-- Info card -->
                <div *ngIf="msg.rich?.type === 'info'" class="msg-bot">
                    <h4 class="font-bold">{{ msg.rich.title }}</h4>
                    <p>{{ msg.rich.subtitle }}</p>
                </div>

                <!-- Chips -->
                <div *ngIf="msg.rich?.type === 'chips'" class="inline-block mt-1">
                    <button *ngFor="let opt of msg.rich.options"
                        class="bg-white px-3 py-1 m-1 rounded-full hover:bg-blue-600 transition"
                        (click)="handleChipClick(opt.text)">
                        {{ opt.text }}
                    </button>
                </div>
            </div>
        </div>

        <div class="p-4 fixed bottom-[5rem] right-0">
            <button class="btn-azul-chatbot">
                <span class="material-symbols-rounded">exclamation</span>
            </button>
        </div>
        <div class="flex items-center bg-white rounded-full justify-between py-1 pl-3 pr-1">
            <input type="text" placeholder="Escribe un mensaje..." [(ngModel)]="newMessage"
                (keydown.enter)="sendMessage()"
                class="input-chat" />

            <button
                class="w-10 h-10 bg-marron-oscuro rounded-full flex items-center justify-center text-white hover:opacity-90 transition"
                (click)="sendMessage()">
                <span class="material-symbols-rounded">send</span>
            </button>
        </div>
    </div>
</div>
