<div class="fixed right-0 bottom-0 transition-all duration-400 z-40" [ngClass]="{
    ' top-0 h-[85vh] mt-23': inMontajeMode && isDesktop,     
    'w-1/4  ':  isDesktop,                    
    ' w-full sm:w-96  h-[85vh] ': !inMontajeMode || !isDesktop,
    'h-20': !chatVisible && (!inMontajeMode || isMobile)
  }">

    <button *ngIf="!chatVisible && (!inMontajeMode || isMobile)"
        class="absolute flex bottom-10 right-6 bg-beige text-marron-oscuro items-center justify-center p-4 rounded-full shadow-lg hover:scale-110 transition-transform"
        (click)="toggleChat()">
        <span class="material-symbols-rounded w-9 h-9">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" fill="currentColor">
                <path
                    d="M470-200h-10q-142 0-241-99t-99-241q0-142 99-241t241-99q71 0 132.5 26.5t108 73q46.5 46.5 73 108T800-540q0 134-75.5 249T534-111q-10 5-20 5.5t-18-4.5q-8-5-14-13t-7-19l-5-58Zm90-26q71-60 115.5-140.5T720-540q0-109-75.5-184.5T460-800q-109 0-184.5 75.5T200-540q0 109 75.5 184.5T460-280h100v54Zm-101-95q17 0 29-12t12-29q0-17-12-29t-29-12q-17 0-29 12t-12 29q0 17 12 29t29 12Zm-87-304q11 5 22 .5t18-14.5q9-12 21-18.5t27-6.5q24 0 39 13.5t15 34.5q0 13-7.5 26T480-558q-25 22-37 41.5T431-477q0 12 8.5 20.5T460-448q12 0 20-9t12-21q5-17 18-31t24-25q21-21 31.5-42t10.5-42q0-46-31.5-74T460-720q-32 0-59 15.5T357-662q-6 11-1.5 21.5T372-625Zm88 112Z" />
            </svg></span>
    </button>

    <div *ngIf="chatVisible" class="bg-beige  overflow-hidden shadow-2xl flex flex-col h-full w-full px-5 py-4 "
        [ngClass]="{
    'rounded-t-3xl': !inMontajeMode || isMobile}">

        <header class="flex justify-between items-center">
            <h2 class="text-2xl font-semibold text-marron-oscuro">Allen</h2>
            <button (click)="toggleChat()" class="btn-hover-marron" [ngClass]="{
    'hidden': inMontajeMode && isDesktop}">
                <svg xmlns="http://www.w3.org/2000/svg" height="30px" viewBox="0 -960 960 960" width="30px"
                    fill="var(--color-marron-secundario)">
                    <path d="M480-361q-8 0-15-2.5t-13-8.5L268-556q-11-11-11-28t11-28q11-11 28-11t28 11l156 156 
                    156-156q11-11 28-11t28 11q11 11 11 28t-11 28L508-372q-6 6-13 8.5t-15 2.5Z" />
                </svg>
            </button>
        </header>

        <div #messagesContainer class="flex-1 overflow-y-auto p-4 bg-beige scrollbar-hide ">
            <div *ngFor="let msg of messages" class="mb-2" [ngClass]="{
                'text-right': msg.sender === 'user',
                'text-left': msg.sender === 'bot'
                }">
                <div *ngIf="msg.rich?.type === 'card'" class="msg-bot border p-3 rounded-md shadow mb-2 bg-white">
                    <img *ngIf="msg.rich.imageUri" [src]="msg.rich.imageUri" alt="Card image"
                        class="w-full h-32 object-cover rounded-md mb-2">
                    <h4 class="font-bold">{{ msg.rich.title }}</h4>
                    <p class="text-sm text-gray-700 whitespace-pre-line">{{ msg.rich.subtitle }}</p>
                    <div class="mt-2">
                        <button *ngFor="let btn of msg.rich.buttons"
                            class="bg-blue-500 text-white px-3 py-1 m-1 rounded hover:bg-blue-600 transition"
                            (click)="openLink(btn.postback)">
                            {{ btn.text }}
                        </button>
                    </div>
                </div>
                <div *ngIf="msg.text" [ngClass]="msg.sender === 'user'
                    ? 'msg-user'
                    : 'msg-bot'">
                    {{ msg.text }}
                </div>

                <!-- card -->
                <div *ngIf="msg.rich?.type === 'info'" class="msg-bot">
                    <h4 class="font-bold">{{ msg.rich.title }}</h4>
                    <p>{{ msg.rich.subtitle }}</p>
                </div>

                <!-- Botones -->
                <div *ngIf="msg.rich?.type === 'chips'" class="inline-block mt-1">
                    <button *ngFor="let opt of msg.rich.options"
                        class="bg-white px-3 py-1 m-1 rounded-full hover:bg-blue-600 transition"
                        (click)="handleChipClick(opt.text)">
                        {{ opt.text }}
                    </button>
                </div>
            </div>
        </div>

        <!-- Controles de Text-to-Speech -->
        <div class="flex items-center justify-between bg-white rounded-lg p-2 mb-2 border border-gray-200">
            <!-- Toggle TTS -->
            <div class="flex items-center space-x-2">
                <button 
                    (click)="toggleTTS()"
                    class="p-1 rounded-full transition-colors duration-200"
                    [ngClass]="ttsEnabled ? 'bg-green-100 text-green-600' : 'bg-gray-100 text-gray-400'"
                    title="Activar/desactivar lectura en voz alta">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                    </svg>
                </button>
                
                <!-- Indicador de reproducción -->
                <div *ngIf="isPlaying" class="flex items-center text-blue-600 text-sm">
                    <div class="animate-pulse w-2 h-2 bg-blue-600 rounded-full mr-1"></div>
                    Reproduciendo...
                </div>
                
                <!-- Botón para repetir último mensaje -->
                <button 
                    (click)="replayLastBotMessage()"
                    class="p-1 text-gray-600 hover:text-blue-600 transition-colors"
                    title="Repetir último mensaje del bot">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
                    </svg>
                </button>

                <!-- Botón para detener -->
                <button 
                    (click)="stopSpeaking()"
                    class="p-1 text-gray-600 hover:text-red-600 transition-colors"
                    title="Detener reproducción">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M6 6h12v12H6z"/>
                    </svg>
                </button>
            </div>

            <!-- Control de volumen -->
            <div class="flex items-center space-x-2" *ngIf="ttsEnabled">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-gray-500" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
                </svg>
                <input 
                    type="range" 
                    min="0" 
                    max="1" 
                    step="0.1"
                    [value]="ttsVolume"
                    (input)="onVolumeChange($event)"
                    class="w-16 h-1 bg-gray-300 rounded-lg appearance-none cursor-pointer">
            </div>
        </div>

        <!-- Botón de incidencia movido dentro del chat visible y con posición relativa -->
        <div class="relative py-2">
            <button class="btn-azul-chatbot absolute -top-16 right-0" (click)="abrirIncidencia()">
                <span class="material-symbols-rounded w-7 h-7">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" fill="currentColor">
                        <path
                            d="M480-400q-17 0-28.5-11.5T440-440v-280q0-17 11.5-28.5T480-760q17 0 28.5 11.5T520-720v280q0 17-11.5 28.5T480-400Zm0 200q-17 0-28.5-11.5T440-240q0-17 11.5-28.5T480-280q17 0 28.5 11.5T520-240q0 17-11.5 28.5T480-200Z" />
                    </svg></span>
            </button>
        </div>

        <div class="flex items-center bg-white rounded-full justify-between py-1 pl-3 pr-1">
            <input #messageInput type="text" placeholder="Escribe un mensaje..." [(ngModel)]="newMessage"
                (keydown.enter)="sendMessage()" class="input-chat" focused/>

            <button
                class="p-2 bg-marron-oscuro rounded-full flex items-right justify-end text-white hover:opacity-90 transition"
                (click)="sendMessage()">
                <span class="material-symbols-rounded w-7 h-7">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" fill="currentColor">
                        <path
                            d="M792-443 176-183q-20 8-38-3.5T120-220v-520q0-22 18-33.5t38-3.5l616 260q25 11 25 37t-25 37ZM200-280l474-200-474-200v140l240 60-240 60v140Zm0 0v-400 400Z" />
                    </svg></span>
            </button>
        </div>
    </div>
</div>
