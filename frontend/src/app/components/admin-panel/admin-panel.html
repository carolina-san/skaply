<div class="h-screen bg-marron-oscuro text-white flex flex-col p-6 pt-30">
    <!-- Admin Info Section -->
    <div *ngIf="currentUser" class="flex flex-col items-center gap-4 mb-8">
        <!-- Avatar Placeholder -->
        <div
            class="w-24 h-24 rounded-full bg-azul-claro flex items-center justify-center text-marron-oscuro text-3xl font-bold uppercase">
            {{ currentUser.emailuser?.charAt(0) }}
        </div>

        <!-- User Info -->
        <div class="text-center">
            <h2 class="text-lg font-semibold">{{ currentUser.company_name || 'Administrador' }}</h2>
            <p class="text-sm text-gray-300">{{ currentUser.emailuser }}</p>
            <span
                class="inline-block mt-2 px-3 py-1 bg-azul-claro text-marron-oscuro text-xs font-medium rounded-full uppercase">
                {{ currentUser.role }}
            </span>
        </div>
    </div>

    <nav class="flex-1 flex flex-col gap-2">
        <a class="px-4 py-3 rounded-lg hover:bg-white/10 transition cursor-pointer flex items-center gap-3">
            <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px"
                fill="currentColor">
                <path
                    d="M520-640v-160q0-17 11.5-28.5T560-840h240q17 0 28.5 11.5T840-800v160q0 17-11.5 28.5T800-600H560q-17 0-28.5-11.5T520-640Zm0 480v-320q0-17 11.5-28.5T560-520h240q17 0 28.5 11.5T840-480v320q0 17-11.5 28.5T800-120H560q-17 0-28.5-11.5T520-160Zm-400 0v-160q0-17 11.5-28.5T160-360h240q17 0 28.5 11.5T440-320v160q0 17-11.5 28.5T400-120H160q-17 0-28.5-11.5T120-160Zm0-320v-320q0-17 11.5-28.5T160-840h240q17 0 28.5 11.5T440-800v320q0 17-11.5 28.5T400-440H160q-17 0-28.5-11.5T120-480Z" />
            </svg>
            Dashboard
        </a>
        <a class="px-4 py-3 rounded-lg hover:bg-white/10 transition cursor-pointer flex items-center gap-3">
            <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px"
                fill="currentColor">
                <path
                    d="M40-160v-112q0-34 17.5-62.5T104-378q62-31 126-46.5T360-440q66 0 130 15.5T616-378q29 15 46.5 43.5T680-272v112H40Zm720 0v-120q0-44-24.5-84.5T666-434q51 6 96 20.5t84 35.5q36 20 55 44.5t19 53.5v120H760ZM360-480q-66 0-113-47t-47-113q0-66 47-113t113-47q66 0 113 47t47 113q0 66-47 113t-113 47Zm400-160q0 66-47 113t-113 47q-11 0-28-2.5t-28-5.5q27-32 41.5-71t14.5-81q0-42-14.5-81T544-792q14-5 28-6.5t28-1.5q66 0 113 47t47 113Z" />
            </svg>
            Proveedores
        </a>
        <a class="px-4 py-3 rounded-lg hover:bg-white/10 transition cursor-pointer flex items-center gap-3">
            <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px"
                fill="currentColor">
                <path
                    d="M160-200v-360q0-19 8.5-36t23.5-28l240-180q21-16 48-16t48 16l240 180q15 11 23.5 28t8.5 36v360q0 33-23.5 56.5T720-120H600q-17 0-28.5-11.5T560-160v-200q0-17-11.5-28.5T520-400h-80q-17 0-28.5 11.5T400-360v200q0 17-11.5 28.5T360-120H240q-33 0-56.5-23.5T160-200Z" />
            </svg>
            Solicitudes
        </a>
    </nav>

    <button (click)="logout()"
        class="mt-auto px-4 py-3 rounded-full bg-beige hover:bg-beige/80 transition flex flex-row items-center gap-3 text-marron-oscuro flex-wrap">
        <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px" fill="currentColor">
            <path
                d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h280v80H200v560h280v80H200Zm440-160-55-58 102-102H360v-80h327L585-622l55-58 200 200-200 200Z" />
        </svg>
        Cerrar sesión
    </button>
</div>
