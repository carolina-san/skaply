<div class="h-screen font-sans relative bg-beige">

    <main class="relative">
        <div class="relative z-10 flex flex-col items-center justify-start h-screen pt-20 top-10">
            <div class="text-center mb-6">
                <h1 class="text-marron-oscuro text-2xl lg:text-5xl font-bold mb-2">Mueble de madera</h1>
            </div>

            <app-furniture-viewer></app-furniture-viewer>

            <div class="flex flex-col lg:flex-row gap-3 w-full max-w-md px-4 mb-8">
                <button (click)="resetCamera()" class="btn-primary-2">
                    <span>Resetear Vista</span>
                    <span class="material-symbols-rounded">3d_rotation</span>
                </button>

                <button (click)="toggleWireframe()" class="btn-primary-2">
                    <span>Wireframe</span>
                    <span class="material-symbols-rounded">grid_view</span>
                </button>
            </div>
        </div>

        <app-chatbot></app-chatbot>

        <app-menu-viewer></app-menu-viewer>
    </main>
</div>
