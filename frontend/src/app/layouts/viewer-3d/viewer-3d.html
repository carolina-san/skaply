<div class="fixed h-screen font-sans relative bg-marron-oscuro overflow-hidden">
    <main class="relative top-28 flex flex-col justify-start pt-20">

        <app-furniture-viewer></app-furniture-viewer>

        <!-- Panel de información de controles -->
        <div class="ml-4 bg-beige rounded-2xl px-3 py-1.5 text-xs w-fit mb-3">
            <div class="flex items-center gap-1 text-marron-oscuro whitespace-nowrap">
                <span class="material-symbols-rounded text-sm">mouse</span>
                <span>Clic + arrastrar para rotar | Rueda para zoom</span>
            </div>
        </div>

        <div class="flex gap-2 max-w-[10rem] ml-4 mb-4">
            <button (click)="resetCamera()" class="btn-canvas">
                <span class="material-symbols-rounded text-lg group-hover:scale-110 transition-transform duration-300">3d_rotation</span>
                <span class="text-[10px]">Resetear</span>
            </button>

            <button (click)="toggleWireframe()" class="btn-canvas">
                <span class="material-symbols-rounded text-lg group-hover:scale-110 transition-transform duration-300">grid_view</span>
                <span class="text-[10px]">Wireframe</span>
            </button>
        </div>

        <app-chatbot></app-chatbot>
        <app-menu-viewer></app-menu-viewer>
    </main>
</div>
