<div class="fixed inset-0 bg-marron-oscuro  flex">

  <!-- Contenedor principal: ocupa el espacio restante -->
  <div class=" h-full w-full md:w-[75%]">
    <app-graphics-engine [furnitureId]="furnitureId" [furnitureName]="furnitureName"
      (arStateChange)="isARActive.set($event)" (finished)="openReviewModal()"></app-graphics-engine>
  </div>


  @if (!isARActive()) {
  <app-chatbot (abrirModalIncidencia)="abrirModalIncidencia()"></app-chatbot>
  }

  <!-- Modal de incidencia -->
  <app-issue-form [furnitureId]="furnitureId"></app-issue-form>


  <!-- Modal de finalización -->
  <app-modal [open]="isReviewModalOpen()" (openChange)="isReviewModalOpen.set($event)" title="¡Montaje finalizado!">
    <div class="p-7 bg-white rounded-xl">
      <div class="flex flex-col items-center justify-center space-y-6">
        <h3 class="text-3xl font-bold text-marron-oscuro">¡Felicidades!</h3>
        <p class="text-center text-marron-oscuro">Has completado el montaje de <strong>{{ furnitureName }}</strong>
        </p>

        <!-- Sistema de calificación por estrellas -->
        <div class="w-full max-w-md space-y-4">
          <div class="text-center">
            <p class="text-marron-oscuro font-semibold mb-2">¿Qué te pareció el proceso? (opcional)</p>
            <div class="flex justify-center space-x-2">
              @for (star of [1, 2, 3, 4, 5]; track star) {
              <button type="button" (click)="setRating(star)"
                class="focus:outline-none transition-transform hover:scale-110">
                <svg class="w-10 h-10 transition-colors" [class.text-yellow-400]="star <= reviewStars()"
                  [class.text-marron-oscuro]="star > reviewStars()" xmlns="http://www.w3.org/2000/svg"
                  [attr.fill]="star <= reviewStars() ? 'currentColor' : 'none'" viewBox="0 0 24 24"
                  stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" />
                </svg>
              </button>
              }
            </div>
          </div>

          <!-- Campo de texto para comentarios -->
          <div>
            <textarea id="reviewText" [ngModel]="reviewText()" (ngModelChange)="reviewText.set($event)" rows="3"
              placeholder="¿Fue fácil de seguir? ¿Qué te pareció el mueble?"
              class="w-full px-4 py-2 border border-marron-claro rounded-lg focus:outline-none focus:ring-2 focus:ring-azul-claro resize-none text-marron-oscuro"></textarea>
          </div>
        </div>

        <!-- Botones de acción -->
        <div class="flex space-x-4 mt-4">
          <button (click)="graphicsEngine.reset(); closeReviewModal()" type="button"
            class="px-6 py-2 bg-azul-claro text-marron-oscuro font-semibold rounded-full hover:bg-azul-claro/80 transition-colors">
            Reiniciar
          </button>
          <button (click)="skipReview()" type="button"
            class="px-6 py-2 bg-azul-claro text-marron-oscuro font-semibold rounded-full hover:bg-azul-claro/80 transition-colors">
            Omitir
          </button>
          <button (click)="submitReview()" type="button" [disabled]="reviewStars() === 0 || isSubmittingReview()"
            class="px-6 py-2 bg-marron-oscuro text-white font-semibold rounded-full hover:brightness-110 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
            {{ isSubmittingReview() ? 'Enviando...' : 'Enviar Reseña' }}
          </button>
        </div>
      </div>
    </div>
  </app-modal>
</div>
