<div class="fixed inset-0 h-[100dvh] relative bg-marron-oscuro overflow-hidden flex">

  <!-- Contenedor principal: ocupa el espacio restante -->
  <div class=" h-full w-full lg:w-[75%]">
    <app-graphics-engine [furnitureId]="furnitureId" [furnitureName]="furnitureName"
      (arStateChange)="isARActive.set($event)" (finished)="openReviewModal()"></app-graphics-engine>
  </div>


  @if (!isARActive()) {
  <app-chatbot (abrirModalIncidencia)="abrirModalIncidencia()"></app-chatbot>
  }

  <!-- Modal de incidencia -->
  <app-issue-form [furnitureId]="furnitureId"></app-issue-form>


  <!-- Modal de finalización -->
  <app-modal [open]="isReviewModalOpen()" (openChange)="isReviewModalOpen.set($event)" title="¡Montaje finalizado!">
    <div class="justify-left h-full p-8 pb-15 sm:pb-8 rounded-tl-xl rounded-tr-xl sm:rounded-xl flex flex-col">

      <!-- HEADER -->
      <div class="text-center mb-8">

        <h2 class="text-3xl font-semibold text-marron-oscuro flex items-center justify-center gap-2">
          <svg class="w-12 h-12 text-marron-oscuro" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
          </svg> ¡Montaje completado!
        </h2>
        <p class="text-lg text-marron-oscuro mt-1">
          Has finalizado el montaje de
          <span class="!font-bold">{{ furnitureName }}</span>
        </p>
      </div>

      <!-- RATING -->
      <div class="mb-3">
        <p class="text-sm font-medium text-marron-oscuro text-left mb-1">
          ¿Cómo ha sido tu experiencia?
        </p>

        <div class="flex justify-left gap-1">
          @for (star of [1, 2, 3, 4, 5]; track star) {
          <button type="button" (click)="setRating(star)" class="group transition-transform hover:scale-110">

            <svg class="w-6 h-6 transition-colors duration-200" [class.text-yellow-400]="star <= reviewStars()"
              [class.text-marron-oscuro]="star > reviewStars()" xmlns="http://www.w3.org/2000/svg"
              [attr.fill]="star <= reviewStars() ? 'currentColor' : 'white'" viewBox="0 0 24 24" stroke="currentColor"
              stroke-width="1">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" />
            </svg>
          </button>
          }
        </div>
      </div>

      <!-- TEXTAREA -->
      <textarea id="reviewText" [ngModel]="reviewText()" (ngModelChange)="reviewText.set($event)" rows="3"
        placeholder="Cuéntanos más detalles (opcional)" class="w-full px-4 py-3 bg-white border-[1px] border-marron-oscuro/60 rounded-xl
           focus:outline-none focus:ring-2 focus:ring-azul-claro/50
           resize-none text-sm text-marron-oscuro/80 transition">
  </textarea>
      <div *ngIf="reviewText().length > 0 && reviewStars() === 0" class="text-sm text-red-600 text-left mt-2">
        Selecciona al menos una estrella para enviar tu reseña.
      </div>
      <!-- STATUS -->
      <div class="mt-2">
        <div *ngIf="submitStatus() === 'success'"
          class="p-3 bg-green-50 border border-green-200 text-green-700 rounded-lg text-sm text-center">
          {{ submitMessage() }}
        </div>

        <div *ngIf="submitStatus() === 'error'"
          class="p-3 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm text-center">
          {{ submitMessage() }}
        </div>
      </div>

      <!-- ACTIONS -->
      <div class="flex justify-between gap-3 mt-2" *ngIf="submitStatus() !== 'success'">
        <button (click)="graphicsEngine.reset(); closeReviewModal()" type="button"
          class="px-2 pr-4 py-2 flex items-center gap-2 bg-azul-claro text-marron-oscuro font-semibold rounded-full hover:bg-azul-medio transition-colors border-[1px] border-marron-oscuro/60">
          <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
            fill="currentColor">
            <path
              d="M339.5-108.5q-65.5-28.5-114-77t-77-114Q120-365 120-440q0-17 11.5-28.5T160-480q17 0 28.5 11.5T200-440q0 117 81.5 198.5T480-160q117 0 198.5-81.5T760-440q0-117-81.5-198.5T480-720h-6l34 34q12 12 11.5 28T508-630q-12 12-28.5 12.5T451-629L348-732q-12-12-12-28t12-28l103-103q12-12 28.5-11.5T508-890q11 12 11.5 28T508-834l-34 34h6q75 0 140.5 28.5t114 77q48.5 48.5 77 114T840-440q0 75-28.5 140.5t-77 114q-48.5 48.5-114 77T480-80q-75 0-140.5-28.5Z" />
          </svg>
          Reiniciar </button>
        <div class="flex justify-end gap-6">
          <button (click)="skipReview()" type="button"
            class="text-sm text-marron-oscuro/70 underline hover:text-marron-oscuro transition">
            Omitir
          </button>

          <button (click)="submitReview()" type="button" [disabled]="reviewStars() === 0 || isSubmittingReview()" class="px-5 py-2.5 bg-marron-oscuro text-white text-sm font-medium
             rounded-full hover:bg-marron-secundario transition
             disabled:opacity-50 disabled:cursor-not-allowed!">
            {{ isSubmittingReview() ? 'Enviando...' : 'Enviar reseña' }}
          </button>
        </div>
      </div>

    </div>
  </app-modal>
</div>
