    <app-chatbot (abrirModalIncidencia)="abrirModalIncidencia()"></app-chatbot>
    <app-modal [(open)]="isIncidenciaModalOpen">

        <div class="p-6 sm:p-8 space-y-6">

            <!-- TÍTULO -->
            <h2 class="text-3xl font-bold text-marron-oscuro text-center sm:text-left">
                Reportar Incidencia
            </h2>

            <!-- FORMULARIO -->
            <form (ngSubmit)="enviarIncidencia()" #incidenciaForm="ngForm" class="space-y-5">

                <!-- DESCRIPCIÓN -->
                <div class="space-y-2">
                    <label for="descripcion" class="block text-marron-oscuro font-medium">
                        Descripción de la incidencia: 
                    </label>

                    <textarea id="descripcion" name="descripcion" [(ngModel)]="descripcionIncidencia" required rows="4"
                        placeholder="Describe el problema que encontraste..." class="w-full p-3 rounded-lg border border-gray-300 bg-white
                 focus:outline-none focus:ring-2 focus:ring-marron-oscuro transition">
        </textarea>
                </div>

                <!-- EMAIL -->
                <div class="space-y-2">
                    <label for="email" class="block text-marron-oscuro font-medium">
                        Email (opcional):
                    </label>

                    <input id="email" type="email" name="email" [(ngModel)]="emailIncidencia" placeholder="tu@email.com"
                        class="w-full p-3 rounded-lg border border-gray-300 bg-white
                 focus:outline-none focus:ring-2 focus:ring-marron-oscuro transition">

                    <p class="text-xs text-gray-600">
                        Si deseas recibir respuesta sobre esta incidencia.
                    </p>
                </div>

                <!-- BOTONES -->
                <div class="flex justify-end gap-3 pt-3">

                    <button type="button" (click)="isIncidenciaModalOpen = false" class="px-4 py-2 rounded-lg bg-gray-200 text-gray-700
                 hover:bg-gray-300 transition">
                        Cancelar
                    </button>

                    <button type="submit" class="px-4 py-2 rounded-lg bg-marron-oscuro text-white
                 hover:bg-marron-claro transition shadow-sm" [disabled]="!incidenciaForm.form.valid">
                        Enviar
                    </button>

                </div>

            </form>

        </div>

    </app-modal>

</div>
