<div class="fixed h-screen relative bg-marron-oscuro overflow-hidden flex">

  <!-- Contenedor principal: ocupa el espacio restante -->
  <div class=" h-full w-full md:w-[75%]">
    <app-graphics-engine [furnitureId]="furnitureId" [furnitureName]="furnitureName" (arStateChange)="isARActive.set($event)"></app-graphics-engine>
  </div>

  <!-- Chatbot fijo en desktop -->
  @if (!isARActive()) {
  <div class="hidden lg:block w-96 h-full">
    <app-chatbot (abrirModalIncidencia)="abrirModalIncidencia()"></app-chatbot>
  </div>

  <!-- Chatbot overlay en móvil -->
  <div class="lg:hidden fixed bottom-5 right-4 z-50">
    <app-chatbot (abrirModalIncidencia)="abrirModalIncidencia()"></app-chatbot>
  </div>
  }

  <!-- Modal de incidencia -->
  <app-modal [(open)]="isIncidenciaModalOpen">
    <div class="p-6 sm:p-8 space-y-6">

      <h2 class="text-3xl font-bold text-marron-oscuro text-center sm:text-left">
        Reportar Incidencia
      </h2>

      <!-- formulario incidencia (descripcion e email) -->
      <form (ngSubmit)="enviarIncidencia()" #incidenciaForm="ngForm" class="space-y-5">
        <div class="space-y-2">
          <label for="descripcion" class="block text-marron-oscuro font-medium">Descripción de la incidencia:</label>
          <textarea id="descripcion" name="descripcion" [(ngModel)]="descripcionIncidencia" required rows="4"
            placeholder="Describe el problema que encontraste..." 
            class="w-full p-3 rounded-lg border border-gray-300 opacity-50 bg-white focus:outline-none focus:ring-2 focus:ring-marron-oscuro transition">
          </textarea>
        </div>

        <div class="space-y-2">
          <label for="email" class="block text-marron-oscuro font-medium">Email (opcional):</label>
          <input id="email" type="email" name="email" [(ngModel)]="emailIncidencia" placeholder="ejemplo@email.com"
            class="w-full p-3 rounded-lg border border-gray-300 opacity-50 bg-white focus:outline-none focus:ring-2 focus:ring-marron-oscuro transition">
          <p class="text-xs text-marron-oscuro pt-2">
            Si deseas recibir respuesta sobre esta incidencia.
          </p>
        </div>

        <div class="flex justify-end gap-3 pt-3">
          <button type="button" (click)="isIncidenciaModalOpen = false" 
                  class="px-4 py-2 rounded-lg bg-azul-claro text-marron-oscuro hover:bg-gray-300 transition">
            Cancelar
          </button>
          <button type="submit" 
                  class="px-4 py-2 rounded-lg bg-marron-oscuro text-white hover:bg-marron-claro transition shadow-sm disabled:opacity-50 disabled:cursor-not-allowed"
                  [disabled]="!isDescripcionValida()">
            Enviar
          </button>
        </div>
      </form>
    </div>
  </app-modal>
</div>
