<main class="flex flex-col pt-6">

  <!-- Barra de búsqueda y filtros -->
  <div class="w-full mx-auto mb-6 flex gap-3 items-center flex-shrink-0 px-4">
    <div class="relative flex-1">
      <span
        (mousedown)="onSearch()"
        class="material-symbols-rounded absolute left-3 top-1/2 -translate-y-1/2 text-marron-oscuro text-xl cursor-pointer hover:text-amber-900 transition-colors">search</span>
      <input 
        #searchInput
        type="text" 
        placeholder="Buscar"
        [(ngModel)]="searchText"
        (keypress)="onSearchKeyPress($event)"
        (blur)="onSearchBlur()"
        class="w-full bg-beige rounded-full pl-10 pr-4 py-2 text-marron-oscuro focus:outline-none focus:ring-2 focus:ring-azul-claro">
    </div>

    <!-- Botón de filtros -->
    <button (click)="openFilterModal()"
      class="bg-beige text-marron-oscuro p-2 rounded-full shadow-lg relative flex-shrink-0 cursor-pointer hover:bg-azul-claro transition-colors">
      <span class="material-symbols-rounded text-xl">tune</span>
      <span *ngIf="activeFiltersCount > 0"
        class="absolute -top-1 -right-1 bg-azul-claro text-white text-xs w-4 h-4 rounded-full flex items-center justify-center text-[10px]">
        {{ activeFiltersCount }}
      </span>
    </button>
  </div>

  
  <!-- Resultados de búsqueda y filtros activos -->
  <div class="mb-6 px-4">
    
    <!-- Búsqueda activa -->

    <!-- <div *ngIf="hasSearched && previousSearchText" class="mb-4"> -->
      
      <div *ngIf="hasSearched && previousSearchText" class="flex items-center gap-2 mb-3">
        <p class="text-beige text-lg font-semibold">
          Resultado de la búsqueda: 
          <span class="text-azul-claro">{{ previousSearchText }}</span>
        </p>
        <span
          (click)="clearSearch()"
          class="material-symbols-rounded text-beige text-xl cursor-pointer hover:text-red-600 transition-colors flex-shrink-0">
          close
        </span>
      </div>

      <div *ngIf="!hasSearched && selectedCategoryId !== null && activeFiltersCount > 0" class="flex items-center gap-2 mb-3">
        <p class="text-beige text-lg font-semibold">
          Categoría seleccionada: 
          <span class="text-azul-claro">{{ getCategoryName(selectedCategoryId) }}</span>
        </p>
        <span
          (click)="clearSearch()"
          class="material-symbols-rounded text-beige text-xl cursor-pointer hover:text-red-600 transition-colors flex-shrink-0">
          close
        </span>
      </div>

      <!-- Filtros activos -->
      <div *ngIf="(hasSearched && previousSearchText) || (!hasSearched && selectedCategoryId !== null && activeFiltersCount > 0)" class="flex flex-wrap gap-2">

        <!-- Filtros de color -->
        <div *ngFor="let colorId of activeFilters.color_ids" 
             class="flex items-center gap-2 px-3 py-1 border-2 border-marron-oscuro rounded-full bg-beige">
          <span class="text-marron-oscuro text-sm font-medium">
            {{ getColorName(colorId) }}
          </span>
          <span (click)="removeColorFilter(colorId)" 
                class="material-symbols-rounded text-marron-oscuro text-base cursor-pointer hover:text-red-600 transition-colors">
            close
          </span>
        </div>

        <!-- Filtros de dificultad -->
        <div *ngFor="let difficulty of activeFilters.difficulties" 
             class="flex items-center gap-2 px-3 py-1 border-2 border-marron-oscuro rounded-full bg-beige">
          <span class="text-marron-oscuro text-sm font-medium">
            {{ getDifficultyLabel(difficulty) }}
          </span>
          <span (click)="removeDifficultyFilter(difficulty)" 
                class="material-symbols-rounded text-marron-oscuro text-base cursor-pointer hover:text-red-600 transition-colors">
            close
          </span>
        </div>

        <!-- Filtros de proveedor -->
        <div *ngFor="let providerId of activeFilters.provider_ids" 
             class="flex items-center gap-2 px-3 py-1 border-2 border-marron-oscuro rounded-full bg-beige">
          <span class="text-marron-oscuro text-sm font-medium">
            {{ getProviderName(providerId) }}
          </span>
          <span (click)="removeProviderFilter(providerId)" 
                class="material-symbols-rounded text-marron-oscuro text-base cursor-pointer hover:text-red-600 transition-colors">
            close
          </span>
        </div>

      </div>

    <!-- </div> -->

    <!-- Carrusel de filtros de categorías -->
    <div *ngIf="!hasSearched && (selectedCategoryId === null || activeFiltersCount === 0)" class="flex gap-2 overflow-x-auto pb-1 scrollbar-hide">
      <button       
        (click)="filterByCategory(null)" 
        class="btn-filtros-home cursor-pointer hover:bg-opacity-90 transition-colors"
        [class.!bg-azul-claro]="selectedCategoryId === null" >
        <!-- [class.!text-white]="selectedCategoryId === null" > -->
        Ver todo
      </button>
      <button 
        *ngFor="let category of categories" 
        (click)="filterByCategory(category.id)" 
        class="btn-filtros-home cursor-pointer hover:bg-opacity-90 transition-colors"
        [class.!bg-azul-claro]="selectedCategoryId === category.id" >
        <!-- [class.!text-white]="selectedCategoryId === category.id"> -->
        {{ category.name }}
      </button>
    </div>
  </div>

  <!-- Grid de muebles + Footer (con scroll) -->
  <!-- furniture.file_uri en img [src] -->
  <section class=" m-0 flex flex-col justify-between">
    <div class="grid p-7 gap-6 grid-cols-2 sm:grid-cols-3 md:grid-cols-4 xl:grid-cols-5">
      <app-card-furniture *ngFor="let furniture of furnitures" [furniture]="furniture"></app-card-furniture>
    </div>

    <app-footer class="m-0"></app-footer>
  </section>
  <app-scanner></app-scanner>

  <!-- Filter Panel -->
  <app-filter-panel 
    [isOpen]="isFilterModalOpen" 
    [providers]="providers" 
    [colors]="colors" 
    [activeFilters]="activeFilters"
    [resetToggle]="resetFilterToggle"
    (close)="closeFilterModal()"
    (applyFilter)="onApplyFilters($event)">
  </app-filter-panel>

</main>
