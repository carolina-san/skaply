<main class="flex flex-col pt-6">

  <!-- Barra de búsqueda y filtros -->
  <div class="w-full mx-auto mb-6 flex gap-3 items-center flex-shrink-0 px-4">
    <div class="relative flex-1">
      <span
        (mousedown)="onSearch()"
        class="material-symbols-rounded absolute left-3 top-1/2 -translate-y-1/2 text-marron-oscuro text-xl cursor-pointer hover:text-amber-900 transition-colors">search</span>
      <input 
        #searchInput
        type="text" 
        placeholder="Buscar"
        [(ngModel)]="searchText"
        (keypress)="onSearchKeyPress($event)"
        (blur)="onSearchBlur()"
        class="w-full bg-beige rounded-full pl-10 pr-4 py-2 text-marron-oscuro focus:outline-none focus:ring-2 focus:ring-azul-claro">
    </div>
    <button (click)="openFilterModal()"
      class="bg-beige text-marron-oscuro p-2 rounded-full shadow-lg relative flex-shrink-0 cursor-pointer hover:bg-azul-claro transition-colors">
      <span class="material-symbols-rounded text-xl">tune</span>
      <span *ngIf="activeFiltersCount > 0"
        class="absolute -top-1 -right-1 bg-azul-claro text-white text-xs w-4 h-4 rounded-full flex items-center justify-center text-[10px]">
        {{ activeFiltersCount }}
      </span>
    </button>
  </div>

  <!-- Filtros de categorías -->
  <div class="mb-6 flex gap-2 overflow-x-auto pb-1 scrollbar-hide px-4 pb-0">
    <button       
      (click)="filterByCategory(null)" 
      class="btn-filtros-home cursor-pointer hover:bg-opacity-90 transition-colors"
      [class.!bg-azul-claro]="selectedCategoryId === null" >
      <!-- [class.!text-white]="selectedCategoryId === null" > -->
      Ver todo
    </button>
    <button 
      *ngFor="let category of categories" 
      (click)="filterByCategory(category.id)" 
      class="btn-filtros-home cursor-pointer hover:bg-opacity-90 transition-colors"
      [class.!bg-azul-claro]="selectedCategoryId === category.id" >
      <!-- [class.!text-white]="selectedCategoryId === category.id"> -->
      {{ category.name }}
    </button>
  </div>

  <!-- Grid de muebles + Footer (con scroll) -->
  <!-- furniture.file_uri en img [src] -->
  <section class=" m-0 flex flex-col justify-between">
    <div class="grid p-7 gap-6 grid-cols-2 sm:grid-cols-3 md:grid-cols-4 xl:grid-cols-5">
      <app-card-furniture *ngFor="let furniture of furnitures" [furniture]="furniture"></app-card-furniture>
    </div>

    <app-footer class="m-0"></app-footer>
  </section>
  <app-scanner></app-scanner>

  <!-- Filter Panel -->
  <app-filter-panel [isOpen]="isFilterModalOpen" [providers]="providers" [colors]="colors" (close)="closeFilterModal()"
    (applyFilter)="onApplyFilters($event)">
  </app-filter-panel>

</main>
