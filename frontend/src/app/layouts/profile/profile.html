<div class="pt-24 px-3 ml-100 lg:px-20 w-300 h-screen flex flex-col bg-beige text-marron-oscuro">

  <div class="flex items-center gap-10 text-lg font-semibold mb-6">
    <button class="opacity-40 hover:opacity-100 transition">Dashboard</button>
    <button class="border-b-2 border-beige pb-1">Proveedores</button>
    <button class="relative opacity-40 hover:opacity-100 transition">
      Solicitudes
      <span
        class="absolute -top-2 -right-4 bg-[#e74242] text-white w-5 h-5 text-xs flex items-center justify-center rounded-full">
        2
      </span>
    </button>

    <!-- buscar y filtrar -->
    <div class="flex px-10 gap-6 justify-between items-center mb-5">
      <div class="w-80 bg-white rounded-full flex items-center px-4 shadow">
        <input type="text" placeholder="Buscar"
          class="w-full py-2 outline-none text-marron-oscuro placeholder-marron-oscuro" /><svg
          xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#452621">
          <path
            d="M380-320q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l224 224q11 11 11 28t-11 28q-11 11-28 11t-28-11L532-372q-30 24-69 38t-83 14Zm0-80q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z" />
        </svg>
      </div>


      <button class="bg-white shadow p-3 rounded-full hover:scale-105 transition">
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#452621">
          <path
            d="M440-240q-17 0-28.5-11.5T400-280q0-17 11.5-28.5T440-320h80q17 0 28.5 11.5T560-280q0 17-11.5 28.5T520-240h-80ZM280-440q-17 0-28.5-11.5T240-480q0-17 11.5-28.5T280-520h400q17 0 28.5 11.5T720-480q0 17-11.5 28.5T680-440H280ZM160-640q-17 0-28.5-11.5T120-680q0-17 11.5-28.5T160-720h640q17 0 28.5 11.5T840-680q0 17-11.5 28.5T800-640H160Z" />
        </svg>
      </button>
    </div>
  </div>

  <!-- tabla proveedores -->
  <div class="bg-white rounded-2xl shadow overflow-hidden">
    <div class="grid grid-cols-3 bg-[#bfd2e0] px-6 py-3 font-semibold text-[#452621]">
      <div>Nombre de empresa</div>
      <div>Fecha alta</div>
      <div class="text-center">Acciones</div>
    </div>

    <!-- FILAS -->
    <div *ngFor="let provider of providers" class="grid grid-cols-3 items-center px-6 py-4 border-b text-[#452621]">

      <!-- Nombre -->
      <div>{{ provider.company_name }}</div>

      <div>{{ provider.fecha_alta }}</div>

      <!-- Acciones -->
      <div class="flex justify-center gap-4 text-xl">
        <button class="hover:scale-110 transition text-[#452621]">
          <span class="material-symbols-rounded">visibility</span>
        </button>

        <button class="hover:scale-110 transition text-[#452621]">
          <span class="material-symbols-rounded">edit</span>
        </button>

        <button class="hover:scale-110 transition text-[#b43d3d]">
          <span class="material-symbols-rounded">delete</span>
        </button>
      </div>
    </div>

    <!-- FOOTER PAGINACIÓN -->
    <div class="flex justify-end items-center px-6 py-4 text-sm text-[#452621] gap-4">
      <span>Mostrando {{ providers.length }} de {{ providers.length }}</span>

      <div class="flex gap-2">
        <button class="px-2 py-1 bg-white border rounded hover:bg-gray-100">1</button>
        <button class="px-2 py-1 bg-white border rounded hover:bg-gray-100">2</button>
        <button class="px-2 py-1 bg-white border rounded hover:bg-gray-100">3</button>
      </div>
    </div>
  </div>

</div>
