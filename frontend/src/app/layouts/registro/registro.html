<div class="flex flex-col items-center mb-10 px-6 pt-10 text-azul-claro w-full max-w-lg mx-auto">

    <h1 class="text-4xl font-bold mb-6 text-center">
        Solicita ser proveedor
    </h1>

    <div class="w-full relative mb-3">
        <span class="material-symbols-rounded iconos-registro">
            person
        </span>

        <input type="text" placeholder="Nombre de empresa" class="btn-registro">
    </div>


    <div class="w-full relative mb-3">
        <span class="material-symbols-rounded iconos-registro">
            badge
        </span>
        <input type="text" placeholder="CIF / Nº Fiscal" class="btn-registro">
    </div>

    <div class="w-full relative mb-3">
        <span class="material-symbols-rounded iconos-registro">
            email
        </span>
        <input type="email" placeholder="E-mail" class="btn-registro">
    </div>

    <div class="w-full relative mb-3">
        <span class="material-symbols-rounded iconos-registro">
            phone
        </span>
        <input type="tel" placeholder="Teléfono" class="btn-registro">
    </div>

    <div class="w-full relative mb-3">
        <span class="material-symbols-rounded iconos-registro">
            lock
        </span>
        <input type="password" placeholder="Contraseña" class="btn-registro">
    </div>

    <div class="w-full relative mb-5">
        <span class="material-symbols-rounded iconos-registro">
            lock
        </span>
        <input type="password" placeholder="Confirmar contraseña" class="btn-registro">
    </div>

    <button class="w-full bg-azul-claro text-marron-oscuro font-bold rounded-full py-3 mb-6">
        Enviar solicitud
    </button>

    <div class="flex items-center gap-4 w-full mb-4">
        <span class="flex-1 h-px bg-beige"></span>
        <span>or</span>
        <span class="flex-1 h-px bg-beige"></span>
    </div>

    <button class="w-full border bg-beige rounded-full py-3 flex items-center justify-center gap-2">
        <img src="assets/imgs/google.png" class="h-5 w-5">
        <span class="text-marron-oscuro">Continuar con Google</span>
    </button>

    <p class="mt-4 text-sm text-center">
        ¿Ya tienes una cuenta?
        <a routerLink="/login" class="underline">Inicia sesión</a>
    </p>
</div>

<app-footer></app-footer>
