<!-- Motor Page - Fullscreen Assembly Engine -->
<!-- Wrapped in fixed container to prevent body scrolling on this route -->
<div class="fixed inset-0 overflow-hidden bg-skaply-ui-dark">
  <main class="h-full w-full flex flex-col lg:flex-row">

    <!-- Assembly Engine Section -->
    <section class="flex-1 flex flex-col">
      <!-- Header with title and mobile chatbot toggle -->
      <header
        class="flex items-center justify-between p-4 bg-skaply-ui-dark/95 backdrop-blur-sm border-b border-skaply-light/10 z-10">
        <div class="flex items-center space-x-4">
          <button (click)="goBack()" class="p-2 hover:bg-white/10 rounded-lg transition-colors">
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
            </svg>
          </button>
        </div>

        <!-- Mobile Chatbot Toggle Button (kept) -->
        <button (click)="toggleMobileChatbot()"
          class="lg:hidden p-3 bg-skaply-accent hover:bg-skaply-accent/80 rounded-full transition-all duration-200 transform hover:scale-105">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-3.582 8-8 8a9.863 9.863 0 01-4.255-.949L5 20l1.395-3.72C7.512 15.042 9.201 14 12 14c4.418 0 8-3.582 8-8s-3.582-8-8-8-8 3.582-8 8c0 2.15.85 4.1 2.23 5.53">
            </path>
          </svg>
        </button>
      </header>

      <!-- Interactive Assembly Component -->
      <div class="flex-1 relative p-4">
        <app-graphics-engine></app-graphics-engine>
      </div>
    </section>

    <!-- Desktop Chatbot Sidebar - static copy of the chatbot UI (adapted for desktop sidebar) -->
    <aside
      class="hidden lg:flex lg:flex-col lg:w-96 lg:min-w-96 bg-beige border-l border-marron-oscuro/20 h-full overflow-hidden">
      <!-- Header -->
      <header
        class="bg-beige text-marron-oscuro p-4 flex items-center justify-between border-b border-marron-oscuro/20">
        <div class="flex items-center">
          <span class="text-xl font-bold">Allen</span>
        </div>
      </header>

      <!-- Messages area -->
      <div class="flex-1 overflow-auto p-4 bg-beige">
        <!-- Mensajes del chat (vacío, el componente real seguirá manejando la lógica en móvil) -->
      </div>

      <!-- Quick action button area -->
      <div class="p-4">
        <button class="btn-azul-chatbot">
          <span class="material-symbols-rounded">exclamation</span>
        </button>
      </div>

      <!-- Input area -->
      <div class="bg-beige border-t border-marron-oscuro/20 p-4">
        <div class="flex items-center space-x-2">
          <input type="text" placeholder="Mensaje"
            class="flex-1 bg-white border border-marron-oscuro/30 rounded-[25px] px-4 py-2 focus:outline-none focus:border-marron-oscuro">
          <button class="btn-azul-chatbot">
            <span class="material-symbols-rounded w-9">send</span>
          </button>
        </div>
      </div>
    </aside>

  </main>
</div>

<!-- Mobile Chatbot Modal -->
<div *ngIf="mobileChatbotVisible" class="lg:hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-end"
  (click)="closeMobileChatbot($event)">

  <div class="w-full bg-white rounded-t-3xl max-h-[80vh] flex flex-col animate-slide-up"
    (click)="$event.stopPropagation()">

    <!-- Modal Header -->
    <header class="flex items-center justify-between p-4 border-b border-gray-200">
      <h2 class="text-lg font-semibold text-gray-900">Asistente Virtual</h2>
      <button (click)="closeMobileChatbot()" class="p-2 hover:bg-gray-100 rounded-full transition-colors">
        <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </header>

    <!-- Chatbot Content -->
    <div class="flex-1 overflow-hidden">
      <app-chatbot></app-chatbot>
    </div>
  </div>
</div>
